server {
    listen 80;
    server_name staging.asterav8.jp;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Browser-facing Account / Catalog / Billing / Credit APIs belong to the
    # Cloudflare Control Plane. Contabo remains the private Execution Plane
    # reached by Cloudflare through ASTERA_RUNTIME_ORIGIN.
    location /api/ {
        proxy_pass https://api.asterav8.jp;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name api.asterav8.jp;
        proxy_set_header Host api.asterav8.jp;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Astera-Source staging-server;
        proxy_read_timeout 120s;
        proxy_redirect off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
