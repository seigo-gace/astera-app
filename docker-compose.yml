services:
  astera-app-api:
    build:
      context: .
      dockerfile: contabo/app-api/Dockerfile
    container_name: astera-app-api
    env_file:
      - contabo/app-api/.env
    environment:
      ASTERA_STORAGE_UPLOAD_TMP_DIR: /var/lib/astera-storage-upload
      ASTERA_PRIVATE_DATA_TMP_DIR: /run/astera-private-data
      ASTERA_PRIVATE_UPLOAD_MAX_BYTES: "20971520"
      ASTERA_TRANSLATION_ENGINE_ORIGIN: http://127.0.0.1:8792
    volumes:
      - astera-storage-upload-tmp:/var/lib/astera-storage-upload
    tmpfs:
      - /run/astera-private-data:size=268435456,mode=0700,uid=10001,gid=10001
    # Vault, local Translation Engine, and TGserver are intentionally bound to host loopback only.
    # Run the API on the host network so those internal services stay private
    # while remaining reachable from the API runtime.
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8788/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  astera-translation-engine:
    profiles: ["translation"]
    build:
      context: .
      dockerfile: contabo/translation-engine/Dockerfile
    container_name: astera-translation-engine
    env_file:
      - contabo/translation-engine/.env
    environment:
      ASTERA_TRANSLATION_MODEL_PATH: /models/madlad400-3b-mt-ct2
      ASTERA_TRANSLATION_BIND: 127.0.0.1
      PORT: "8792"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ${ASTERA_TRANSLATION_MODEL_DIR:-./.models/madlad400-3b-mt-ct2}:/models/madlad400-3b-mt-ct2:ro
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8792/health', timeout=4).read()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5

  astera-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ASTERA_API_BASE: https://api.asterav8.jp
        VITE_ASTERA_HP_URL: https://asterav8.jp/
        VITE_SUPPORT_DEVELOPMENT_URL: https://asterav8.jp/support/development
        VITE_SUPPORT_CROWDFUNDING_URL: https://asterav8.jp/support/crowdfunding
        VITE_SUPPORT_PARTNERSHIP_URL: https://asterav8.jp/support/partnership
    container_name: astera-app
    ports:
      - "8080:80"
    networks:
      - astera-app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  astera-app:
    name: astera-app

volumes:
  astera-storage-upload-tmp:
