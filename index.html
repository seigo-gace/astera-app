<!doctype html>
<html lang="ja" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <script src="/compatibility-bootstrap.js"></script>
    <link rel="stylesheet" href="/app-interactions.css" />
    <link rel="stylesheet" href="/exterior-shell.css" />
    <link rel="stylesheet" href="/customer-ai-bubble.css" />
    <link rel="stylesheet" href="/gpt-app-alignment.css" />
    <link rel="stylesheet" href="/composer-canonical-controls.css" />
    <link rel="stylesheet" href="/canonical-interaction-contract.css" />
    <link rel="stylesheet" href="/canonical-remainder.css" />
    <link rel="stylesheet" href="/template-management.css" />
    <link rel="stylesheet" href="/external-storage-management.css" />
    <link rel="stylesheet" href="/astera-storage-management.css" />
    <style data-astera-tablet-drawer-fix>
      @media (min-width: 601px) and (max-width: 1100px) {
        .platform-backdrop {
          display: block !important;
          position: fixed !important;
          inset: 0 !important;
          z-index: 60 !important;
          border: 0 !important;
          background: rgba(0, 0, 0, .58) !important;
        }
        .platform-mobile-drawer {
          display: flex !important;
          position: fixed !important;
          z-index: 70 !important;
          inset: env(safe-area-inset-top) auto env(safe-area-inset-bottom) env(safe-area-inset-left) !important;
          max-width: calc(100vw - env(safe-area-inset-left) - 30px) !important;
          flex-direction: column !important;
          overflow-x: hidden !important;
          overflow-y: auto !important;
          background: var(--ex-bg, var(--platform-bg,var(--bg-primary,#090909))) !important;
        }
      }
      .platform-input {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--ex-line, var(--platform-border));
        border-radius: 10px;
        background: var(--ex-bg, var(--platform-bg,var(--bg-primary,#090909)));
        color: var(--ex-muted, var(--platform-muted,var(--text-tertiary,#aaa)));
        -webkit-text-fill-color: var(--ex-muted, var(--platform-muted,var(--text-tertiary,#aaa)));
        padding: 0 11px;
        opacity: 1;
      }
      [data-exterior-project-controls] .exterior-explorer button {
        min-height: 42px;
        border: 1px solid var(--ex-line, var(--platform-border));
        border-radius: 10px;
        background: transparent;
        color: var(--ex-muted, var(--platform-muted,var(--text-tertiary,#aaa)));
        opacity: .55;
      }
    </style>
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Astera" />
    <meta name="description" content="Astera App — 問いを星図に変える。" />
    <title>Astera — 問いを星図に変える</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="/app-interactions.js"></script>
    <script defer src="/exterior-shell.js"></script>
    <script defer src="/exterior-all-surfaces.js"></script>
    <script defer src="/composer-canonical-controls.js"></script>
    <script defer src="/canonical-option-visibility.js"></script>
    <script defer src="/canonical-interaction-contract.js"></script>
    <script defer src="/canonical-remainder.js"></script>
    <script defer src="/template-management.js"></script>
    <script defer src="/external-storage-management.js"></script>
    <script defer src="/astera-storage-management.js"></script>
    <script defer src="/process-user-errors.js"></script>
    <script defer src="/ui-honesty.js"></script>
    <script defer src="/customer-ai-transport.js" data-source="astera-app"></script>
    <script defer src="/customer-ai-bubble.js"></script>
  </body>
</html>
