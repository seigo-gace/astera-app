services:
  astera-app-api-staging:
    build:
      context: .
      dockerfile: contabo/app-api/Dockerfile
    container_name: astera-app-api-staging
    env_file:
      - contabo/app-api/.env
    environment:
      ASTERA_PROCESS_ORIGIN: http://host.docker.internal:7374
      LIBRAL_VAULT_INTERNAL_ORIGIN: http://libral-vault-libral-vault-1:8791
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8789:8788"
    networks:
      - astera-app-staging
      - libral-vault_default
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8788/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  astera-app-staging:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ASTERA_API_BASE: ""
        VITE_ASTERA_HP_URL: https://asterav8.jp/
        VITE_SUPPORT_DEVELOPMENT_URL: https://asterav8.jp/support/development
        VITE_SUPPORT_CROWDFUNDING_URL: https://asterav8.jp/support/crowdfunding
        VITE_SUPPORT_PARTNERSHIP_URL: https://asterav8.jp/support/partnership
    container_name: astera-app-staging
    ports:
      - "8081:80"
    volumes:
      - ./nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - astera-app-staging
    depends_on:
      astera-app-api-staging:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  astera-app-staging:
    name: astera-app-staging
  libral-vault_default:
    external: true
    name: libral-vault_default
