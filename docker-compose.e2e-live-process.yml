services:
  astera-app-api-e2e-live:
    build:
      context: .
      dockerfile: contabo/app-api/Dockerfile
    container_name: astera-app-api-e2e-live
    env_file:
      - contabo/app-api/.env
    environment:
      PORT: "8788"
      ASTERA_PROCESS_ORIGIN: ${ASTERA_PROCESS_ORIGIN:?Set ASTERA_PROCESS_ORIGIN}
      LIBRAL_VAULT_INTERNAL_ORIGIN: http://libral-vault-libral-vault-1:8791
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8793:8788"
    networks:
      - astera-app-e2e-live
      - libral-vault_default
    restart: "no"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8788/ready').then(async r=>{if(!r.ok)process.exit(1);const j=await r.json();if(!j.process_origin)process.exit(2);}).catch(()=>process.exit(1));",
        ]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12

  astera-app-pages-e2e-live:
    image: node:22-bookworm
    container_name: astera-app-pages-e2e-live
    working_dir: /work
    volumes:
      - ./:/work
    env_file:
      - contabo/app-api/.env
    environment:
      ASTERA_RUNTIME_ORIGIN: http://astera-app-api-e2e-live:8788
      E2E_LIVE_PROCESS_PREVIEW_ACTOR: "1"
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        export ASTERA_RUNTIME_SERVICE_TOKEN="$$(printenv INTERNAL_SERVICE_TOKEN)"
        if [ -z "$$ASTERA_RUNTIME_SERVICE_TOKEN" ]; then echo 'missing INTERNAL_SERVICE_TOKEN' >&2; exit 1; fi
        {
          echo "BETTER_AUTH_SECRET=$$ASTERA_RUNTIME_SERVICE_TOKEN"
          echo "BETTER_AUTH_URL=http://127.0.0.1:8788"
          echo "ASTERA_RUNTIME_ORIGIN=http://astera-app-api-e2e-live:8788"
          echo "ASTERA_RUNTIME_SERVICE_TOKEN=$$ASTERA_RUNTIME_SERVICE_TOKEN"
          echo "E2E_LIVE_PROCESS_PREVIEW_ACTOR=1"
        } > .dev.vars
        npm run build
        npm run cloudflare:functions:build
        npx wrangler d1 migrations apply ASTERA_DB --local --persist-to /tmp/astera-d1-e2e-live-process
        npx wrangler pages dev pages-dist --port 8788 --ip 0.0.0.0 --local
    ports:
      - "8780:8788"
    networks:
      - astera-app-e2e-live
    depends_on:
      astera-app-api-e2e-live:
        condition: service_healthy
    restart: "no"

  astera-app-ui-e2e-live:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ASTERA_API_BASE: ""
        VITE_ASTERA_HP_URL: https://asterav8.jp/
        VITE_SUPPORT_DEVELOPMENT_URL: https://asterav8.jp/support/development
        VITE_SUPPORT_CROWDFUNDING_URL: https://asterav8.jp/support/crowdfunding
        VITE_SUPPORT_PARTNERSHIP_URL: https://asterav8.jp/support/partnership
        VITE_PREVIEW_WITHOUT_AUTH: "true"
    container_name: astera-app-ui-e2e-live
    ports:
      - "8083:80"
    volumes:
      - ./nginx.e2e-live-process.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - astera-app-e2e-live
    depends_on:
      astera-app-api-e2e-live:
        condition: service_healthy
      astera-app-pages-e2e-live:
        condition: service_started
    restart: "no"

networks:
  astera-app-e2e-live:
    name: astera-app-e2e-live
  libral-vault_default:
    external: true
    name: libral-vault_default
