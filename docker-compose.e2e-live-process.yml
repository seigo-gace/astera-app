services:
  astera-app-api-e2e-live:
    build:
      context: .
      dockerfile: contabo/app-api/Dockerfile
    container_name: astera-app-api-e2e-live
    env_file:
      - contabo/app-api/.env
    network_mode: host
    environment:
      PORT: "8793"
      ASTERA_PROCESS_ORIGIN: http://127.0.0.1:7375
      LIBRAL_VAULT_INTERNAL_ORIGIN: http://127.0.0.1:8791
    restart: "no"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8793/ready').then(async r=>{if(!r.ok)process.exit(1);const j=await r.json();if(!String(j.process_origin||'').includes('7375'))process.exit(2);}).catch(()=>process.exit(1));",
        ]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12

  astera-app-pages-e2e-live:
    image: node:22-bookworm
    container_name: astera-app-pages-e2e-live
    working_dir: /work
    network_mode: host
    volumes:
      - ./:/work
    env_file:
      - contabo/app-api/.env
    environment:
      ASTERA_RUNTIME_ORIGIN: http://127.0.0.1:8793
      E2E_PAGES_DEV_PORT: "8780"
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        export ASTERA_RUNTIME_SERVICE_TOKEN="$$(printenv INTERNAL_SERVICE_TOKEN)"
        if [ -z "$$ASTERA_RUNTIME_SERVICE_TOKEN" ]; then echo 'missing INTERNAL_SERVICE_TOKEN' >&2; exit 1; fi
        DEV_VARS="/tmp/e2e-live-process.dev.vars"
        {
          echo "BETTER_AUTH_SECRET=$$ASTERA_RUNTIME_SERVICE_TOKEN"
          echo "BETTER_AUTH_URL=http://127.0.0.1:$${E2E_PAGES_DEV_PORT:-8780}"
          echo "ASTERA_RUNTIME_ORIGIN=$${ASTERA_RUNTIME_ORIGIN}"
          echo "ASTERA_RUNTIME_SERVICE_TOKEN=$$ASTERA_RUNTIME_SERVICE_TOKEN"
          echo "E2E_LIVE_PROCESS_PREVIEW_ACTOR=1"
        } > "$$DEV_VARS"
        ln -sf "$$DEV_VARS" /work/.dev.vars
        if [ ! -f pages-dist/index.html ]; then echo 'missing pages-dist/index.html — run npm run build on host before e2e' >&2; exit 1; fi
        if [ ! -f .wrangler/functions-build/index.js ]; then echo 'missing .wrangler/functions-build/index.js — run npm run cloudflare:functions:build on host' >&2; exit 1; fi
        cp -f .wrangler/functions-build/index.js pages-dist/_worker.js
        export CI=1 WRANGLER_SEND_METRICS=false
        npx wrangler d1 migrations apply ASTERA_DB --local
        for tbl in tenants user_profiles credit_accounts account credit_policies; do
          out=$$(npx wrangler d1 execute ASTERA_DB --local --command "SELECT name FROM sqlite_master WHERE type='table' AND name='$$tbl' LIMIT 1;" 2>/dev/null || true)
          if ! echo "$$out" | grep -q "$$tbl"; then
            echo "d1 migrate missing table: $$tbl" >&2
            exit 1
          fi
        done
        npx wrangler d1 execute ASTERA_DB --local --command "INSERT INTO credit_policies (version, status, base_credits, characters_per_credit, file_bytes_per_credit, option_costs, low_threshold, critical_threshold, max_estimate, estimate_ttl_seconds, reservation_ttl_seconds, published_at, created_at) SELECT 'e2e-live-process-v1', 'active', 1, 1000, 1048576, '{\"translation\":0,\"agent-mode\":0,\"document\":0,\"external-storage-transfer\":0}', 100, 10, 100000, 600, 1800, datetime('now'), datetime('now') WHERE NOT EXISTS (SELECT 1 FROM credit_policies WHERE status='active' LIMIT 1);"
        echo 'd1 local schema tables present'
        exec npx wrangler pages dev pages-dist --port "$${E2E_PAGES_DEV_PORT:-8780}" --ip 0.0.0.0 --local --live-reload=false --show-interactive-dev-session=false -b E2E_LIVE_PROCESS_PREVIEW_ACTOR=1
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8780/api/account').then(async r=>{if(r.status!==200)process.exit(1);}).catch(()=>process.exit(1));",
        ]
      interval: 5s
      timeout: 10s
      start_period: 180s
      retries: 36
    depends_on:
      astera-app-api-e2e-live:
        condition: service_healthy
    restart: on-failure

  astera-app-ui-e2e-live:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ASTERA_API_BASE: ""
        VITE_ASTERA_HP_URL: https://asterav8.jp/
        VITE_SUPPORT_DEVELOPMENT_URL: https://asterav8.jp/support/development
        VITE_SUPPORT_CROWDFUNDING_URL: https://asterav8.jp/support/crowdfunding
        VITE_SUPPORT_PARTNERSHIP_URL: https://asterav8.jp/support/partnership
        VITE_PREVIEW_WITHOUT_AUTH: "true"
    container_name: astera-app-ui-e2e-live
    network_mode: host
    volumes:
      - ./nginx.e2e-live-process.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      astera-app-api-e2e-live:
        condition: service_healthy
      astera-app-pages-e2e-live:
        condition: service_healthy
    restart: "no"

networks:
  astera-app-e2e-live:
    name: astera-app-e2e-live
  libral-vault_default:
    external: true
    name: libral-vault_default
