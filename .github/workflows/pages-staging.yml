name: Pages Staging Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: pages-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 9 &&
       github.event.comment.body == '/deploy-staging' &&
       github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_PREVIEW_WITHOUT_AUTH: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREACCOUNTAPI }}
      CLOUDFLARE_ACCOUNT_ID: '6749a1289acc6c158a4621c26c3fbe08'
      CLOUDFLARE_PAGES_PROJECT: 'astera-app-staging'
      STAGING_DOMAIN: 'staging.asterav8.jp'
      EVIDENCE_ISSUE: '9'
      D1_DATABASE_NAME: 'astera-app-staging'
      D1_DATABASE_ID: '08a705ac-50f4-4592-b726-d50154a2a8cb'
      WRANGLER_CACHE_DIR: '/tmp/wrangler-cache'
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Reject preview auth bypass
        id: auth_mode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${VITE_PREVIEW_WITHOUT_AUTH}" != "false" ]; then
            echo "Staging must run with real authentication. VITE_PREVIEW_WITHOUT_AUTH=${VITE_PREVIEW_WITHOUT_AUTH}" >&2
            exit 1
          fi
          echo "Staging authentication mode: real"

      - name: Require deploy credentials
        id: credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLAREACCOUNTAPI secret is empty" >&2
            exit 1
          fi

      - name: Pin Pages production branch to main
        id: pages_config
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            --request PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"production_branch":"main"}')"
          RESPONSE="$response" node <<'NODE'
          const body = JSON.parse(process.env.RESPONSE || '{}');
          if (body.success === false) throw new Error(`Cloudflare project update failed: ${JSON.stringify(body.errors || [])}`);
          if (body.result?.production_branch !== 'main') throw new Error(`Unexpected production branch: ${body.result?.production_branch ?? 'missing'}`);
          if (!Array.isArray(body.result?.domains) || !body.result.domains.includes(process.env.STAGING_DOMAIN)) {
            throw new Error(`Staging custom domain is not attached: ${process.env.STAGING_DOMAIN}`);
          }
          NODE

      - name: Install dependencies
        id: install
        run: npm install --no-audit

      - name: Apply Account, Storage, and Credit D1 migrations
        id: d1_runtime_migrations
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute astera-app-staging --remote --file=migrations/d1/0016_storage_buyout_packs.sql
          npx wrangler d1 execute astera-app-staging --remote --file=migrations/d1/0017_account_registration_state_repair.sql
          npx wrangler d1 execute astera-app-staging --remote --file=migrations/d1/0018_active_credit_formula_v1.sql

      - name: Verify Pages ASTERA_DB binding via Pages API
        id: pages_d1_binding
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const projectName = process.env.CLOUDFLARE_PAGES_PROJECT;
          const expectedId = process.env.D1_DATABASE_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/${projectName}`, {
            headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
          });
          const body = await response.json();
          if (!response.ok || body.success === false) {
            throw new Error(`Pages project read failed: ${JSON.stringify(body.errors || [])}`);
          }
          if (body.result?.name !== projectName) {
            throw new Error(`Pages project name mismatch: ${body.result?.name ?? 'missing'}`);
          }
          const productionDb = body.result?.deployment_configs?.production?.d1_databases?.ASTERA_DB?.id;
          const previewDb = body.result?.deployment_configs?.preview?.d1_databases?.ASTERA_DB?.id;
          if (productionDb !== expectedId || previewDb !== expectedId) {
            throw new Error(`ASTERA_DB binding mismatch production=${productionDb ?? 'missing'} preview=${previewDb ?? 'missing'} expected=${expectedId}`);
          }
          console.log(`Verified Pages ASTERA_DB binding ${projectName} -> ${expectedId}`);
          NODE

      - name: Verify staging D1 binding id
        id: d1_binding
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const expectedName = process.env.D1_DATABASE_NAME;
          const expectedId = process.env.D1_DATABASE_ID;
          const listed = spawnSync('npx', ['wrangler', 'd1', 'list', '--json'], { encoding: 'utf8' });
          if (listed.status !== 0) {
            console.error(listed.stderr || listed.stdout);
            process.exit(1);
          }
          const databases = JSON.parse(listed.stdout || '[]');
          const match = databases.find((row) => row?.name === expectedName);
          if (!match || match.uuid !== expectedId) {
            throw new Error(`D1 binding mismatch for ${expectedName}: expected ${expectedId}, got ${match?.uuid || 'missing'}`);
          }
          console.log(`Verified Pages ASTERA_DB binding ${expectedName} / ${expectedId}`);
          NODE

      - name: Publish commercial catalog to staging D1
        id: catalog_publish
        shell: bash
        run: |
          set -euo pipefail
          # BLOCKED: GitHub Square Access Token secret missing (repo secrets: ASTERAKEY, CLOUDFLAREACCOUNTAPI only).
          # Do not reference secrets.SQUARE_* here; SQUARE_ACCESS_TOKEN must come from a dedicated GitHub secret when added.
          node scripts/publish-commercial-catalog.mjs --remote --cleanup-failed-drafts --resume-version=astera-commercial-2026-09-17-draft-20260917013944

      - name: Verify published commercial catalog
        id: catalog_verify
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute astera-app-staging --remote --json --command "SELECT (SELECT COUNT(*) FROM catalog_versions WHERE status='active') AS active_count, (SELECT checksum FROM catalog_versions WHERE status='active' LIMIT 1) AS checksum, (SELECT published_at FROM catalog_versions WHERE status='active' LIMIT 1) AS published_at, (SELECT COUNT(*) FROM plan_catalog_entries WHERE catalog_version=(SELECT version FROM catalog_versions WHERE status='active' LIMIT 1)) AS plan_entries, (SELECT COUNT(*) FROM plan_billing_variants WHERE catalog_version=(SELECT version FROM catalog_versions WHERE status='active' LIMIT 1)) AS billing_variants, (SELECT COUNT(*) FROM credit_products WHERE catalog_version=(SELECT version FROM catalog_versions WHERE status='active' LIMIT 1)) AS credit_products, (SELECT COUNT(*) FROM astera_storage_plan_limits WHERE catalog_version=(SELECT version FROM catalog_versions WHERE status='active' LIMIT 1)) AS storage_limits, (SELECT COUNT(*) FROM astera_storage_pack_catalog WHERE catalog_version=(SELECT version FROM catalog_versions WHERE status='active' LIMIT 1)) AS storage_packs, (SELECT COUNT(*) FROM plan_billing_variants WHERE catalog_version=(SELECT version FROM catalog_versions WHERE status='active' LIMIT 1) AND plan_id <> 'free' AND square_plan_variation_id IS NOT NULL) AS square_paid_mappings;")"
          RESULT="$result" node <<'NODE'
          const payload = JSON.parse(process.env.RESULT || '[]');
          const row = payload.flatMap((entry) => entry?.results || [])[0] || {};
          if (Number(row.active_count) !== 1) throw new Error(`active catalog count=${row.active_count}`);
          if (!row.checksum) throw new Error('active catalog checksum is NULL');
          if (!row.published_at) throw new Error('active catalog published_at is NULL');
          if (Number(row.plan_entries) !== 5) throw new Error(`plan entries=${row.plan_entries}, expected 5`);
          if (Number(row.billing_variants) !== 9) throw new Error(`billing variants=${row.billing_variants}, expected 9`);
          if (Number(row.credit_products) !== 6) throw new Error(`credit_products=${row.credit_products}, expected 6`);
          if (Number(row.storage_limits) !== 5) throw new Error(`storage limits=${row.storage_limits}`);
          if (Number(row.storage_packs) !== 3) throw new Error(`storage packs=${row.storage_packs}`);
          if (Number(row.square_paid_mappings) !== 8) throw new Error(`square paid mappings=${row.square_paid_mappings}, expected 8`);
          console.log('Verified active commercial catalog projection');
          NODE
          limits="$(npx wrangler d1 execute astera-app-staging --remote --json --command "SELECT plan_id, max_capacity_gb FROM astera_storage_plan_limits WHERE catalog_version=(SELECT version FROM catalog_versions WHERE status='active' LIMIT 1) ORDER BY plan_id ASC;")"
          LIMITS="$limits" node <<'NODE'
          const expected = { basic: 5, business: 50, enterprise: 150, free: 1, pro: 20 };
          const payload = JSON.parse(process.env.LIMITS || '[]');
          const rows = payload.flatMap((entry) => entry?.results || []);
          for (const [planId, maxGb] of Object.entries(expected)) {
            const row = rows.find((item) => item.plan_id === planId);
            if (!row || Number(row.max_capacity_gb) !== maxGb) {
              throw new Error(`storage limit ${planId}=${row?.max_capacity_gb}, expected ${maxGb}`);
            }
          }
          console.log('Verified storage plan limits 1/5/20/50/150');
          NODE

      - name: Verify active Credit Policy
        id: credit_policy
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute astera-app-staging --remote --json --command "SELECT p.version, p.status, p.max_estimate, f.ascii_milli_per_char, f.non_ascii_milli_per_char, f.option_multiplier_milli, f.output_billed FROM credit_policies p JOIN credit_formula_policies f ON f.version = p.version WHERE p.status = 'active';")"
          RESULT="$result" node <<'NODE'
          const payload = JSON.parse(process.env.RESULT || '[]');
          const rows = payload.flatMap((entry) => entry?.results || []);
          if (rows.length !== 1) throw new Error(`Expected exactly one active Credit Policy, found ${rows.length}`);
          const row = rows[0];
          const expected = {
            version: 'credit-formula-2026-09-16-v1',
            status: 'active',
            max_estimate: 1500,
            ascii_milli_per_char: 1000,
            non_ascii_milli_per_char: 1500,
            option_multiplier_milli: 500,
            output_billed: 0,
          };
          for (const [key, value] of Object.entries(expected)) {
            if (row[key] !== value) throw new Error(`Credit Policy ${key}=${String(row[key])}, expected ${String(value)}`);
          }
          console.log(`Verified active Credit Policy ${row.version}`);
          NODE

      - name: Unit tests (commercial catalog)
        id: unit_tests
        run: npm run test:unit

      - name: Build frontend
        id: frontend_build
        run: npm run build

      - name: Write deployment marker
        id: deployment_marker
        shell: bash
        run: |
          set -euo pipefail
          printf '{"github_sha":"%s","branch":"main","auth_mode":"real"}\n' "${GITHUB_SHA}" > dist/__staging_deployment.json

      - name: Build Cloudflare Functions
        id: functions_build
        run: npm run cloudflare:functions:build

      - name: Deploy main to Cloudflare Pages staging
        id: pages_deploy
        run: npx wrangler pages deploy dist --project-name="${CLOUDFLARE_PAGES_PROJECT}" --branch=main

      - name: Verify staging custom domain serves this main commit
        id: public_verify
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const expectedSha = process.env.GITHUB_SHA;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const projectName = process.env.CLOUDFLARE_PAGES_PROJECT;
          const stagingDomain = process.env.STAGING_DOMAIN;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const headers = { Authorization: `Bearer ${token}`, Accept: 'application/json' };

          const projectResponse = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/${projectName}`, { headers });
          const projectBody = await projectResponse.json();
          if (!projectResponse.ok || projectBody.success === false) throw new Error(`Project read failed: ${JSON.stringify(projectBody.errors || [])}`);
          if (projectBody.result?.production_branch !== 'main') throw new Error(`Production branch drifted to ${projectBody.result?.production_branch ?? 'missing'}`);
          if (!Array.isArray(projectBody.result?.domains) || !projectBody.result.domains.includes(stagingDomain)) throw new Error(`Custom domain missing: ${stagingDomain}`);

          const deploymentsResponse = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/${projectName}/deployments?env=production&per_page=1`, { headers });
          const deploymentsBody = await deploymentsResponse.json();
          const latest = Array.isArray(deploymentsBody.result) ? deploymentsBody.result[0] : null;
          if (!deploymentsResponse.ok || deploymentsBody.success === false || !latest) throw new Error('Latest production deployment could not be read.');
          const branch = latest.deployment_trigger?.metadata?.branch || '';
          const commitHash = latest.deployment_trigger?.metadata?.commit_hash || '';
          if (branch !== 'main') throw new Error(`Latest production deployment branch is ${branch || 'missing'}, expected main.`);
          if (commitHash !== expectedSha) throw new Error(`Latest production deployment SHA is ${commitHash || 'missing'}, expected ${expectedSha}.`);

          let publicSha = '';
          let publicAuthMode = '';
          let lastError = '';
          for (let attempt = 1; attempt <= 10; attempt += 1) {
            try {
              const url = `https://${stagingDomain}/__staging_deployment.json?sha=${encodeURIComponent(expectedSha)}&attempt=${attempt}`;
              const response = await fetch(url, { headers: { 'Cache-Control': 'no-cache' } });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const body = await response.json();
              publicSha = body.github_sha || '';
              publicAuthMode = body.auth_mode || '';
              if (publicSha === expectedSha && body.branch === 'main' && publicAuthMode === 'real') break;
              lastError = `served SHA ${publicSha || 'missing'}, auth_mode ${publicAuthMode || 'missing'}`;
            } catch (error) {
              lastError = error instanceof Error ? error.message : String(error);
            }
            await new Promise((resolve) => setTimeout(resolve, 3000));
          }
          if (publicSha !== expectedSha || publicAuthMode !== 'real') {
            throw new Error(`staging.asterav8.jp did not serve authenticated build ${expectedSha}: ${lastError}`);
          }
          console.log(`Verified https://${stagingDomain}/ -> ${expectedSha} (real authentication)`);
          NODE

      - name: Report deployment evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          AUTH_MODE_OUTCOME: ${{ steps.auth_mode.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          PAGES_CONFIG_OUTCOME: ${{ steps.pages_config.outcome }}
          PAGES_D1_BINDING_OUTCOME: ${{ steps.pages_d1_binding.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          UNIT_TESTS_OUTCOME: ${{ steps.unit_tests.outcome }}
          D1_RUNTIME_MIGRATIONS_OUTCOME: ${{ steps.d1_runtime_migrations.outcome }}
          D1_BINDING_OUTCOME: ${{ steps.d1_binding.outcome }}
          CATALOG_PUBLISH_OUTCOME: ${{ steps.catalog_publish.outcome }}
          CATALOG_VERIFY_OUTCOME: ${{ steps.catalog_verify.outcome }}
          CREDIT_POLICY_OUTCOME: ${{ steps.credit_policy.outcome }}
          FRONTEND_BUILD_OUTCOME: ${{ steps.frontend_build.outcome }}
          DEPLOYMENT_MARKER_OUTCOME: ${{ steps.deployment_marker.outcome }}
          FUNCTIONS_BUILD_OUTCOME: ${{ steps.functions_build.outcome }}
          PAGES_DEPLOY_OUTCOME: ${{ steps.pages_deploy.outcome }}
          PUBLIC_VERIFY_OUTCOME: ${{ steps.public_verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/pages-evidence.md
          const token = process.env.CLOUDFLARE_API_TOKEN || '';
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const project = process.env.CLOUDFLARE_PAGES_PROJECT;
          const report = {
            github_sha: process.env.GITHUB_SHA,
            canonical_staging_url: `https://${process.env.STAGING_DOMAIN}/`,
            auth_mode: 'real',
            steps: {
              checkout: process.env.CHECKOUT_OUTCOME,
              setup_node: process.env.NODE_OUTCOME,
              auth_mode: process.env.AUTH_MODE_OUTCOME,
              credentials: process.env.CREDENTIALS_OUTCOME,
              pages_config: process.env.PAGES_CONFIG_OUTCOME,
              pages_d1_binding: process.env.PAGES_D1_BINDING_OUTCOME,
              install: process.env.INSTALL_OUTCOME,
              unit_tests: process.env.UNIT_TESTS_OUTCOME,
              d1_runtime_migrations: process.env.D1_RUNTIME_MIGRATIONS_OUTCOME,
              d1_binding: process.env.D1_BINDING_OUTCOME,
              catalog_publish: process.env.CATALOG_PUBLISH_OUTCOME,
              catalog_verify: process.env.CATALOG_VERIFY_OUTCOME,
              credit_policy: process.env.CREDIT_POLICY_OUTCOME,
              frontend_build: process.env.FRONTEND_BUILD_OUTCOME,
              deployment_marker: process.env.DEPLOYMENT_MARKER_OUTCOME,
              functions_build: process.env.FUNCTIONS_BUILD_OUTCOME,
              pages_deploy: process.env.PAGES_DEPLOY_OUTCOME,
              public_verify: process.env.PUBLIC_VERIFY_OUTCOME,
            },
            cloudflare: null,
          };
          if (token) {
            const [projectResponse, deploymentsResponse] = await Promise.all([
              fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/${project}`, { headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' } }),
              fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/${project}/deployments?env=production&per_page=1`, { headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' } }),
            ]);
            const projectBody = await projectResponse.json().catch(() => ({}));
            const deploymentsBody = await deploymentsResponse.json().catch(() => ({}));
            const latest = Array.isArray(deploymentsBody.result) ? deploymentsBody.result[0] : null;
            report.cloudflare = {
              project: projectResponse.ok && projectBody.success !== false ? {
                name: projectBody.result?.name || null,
                production_branch: projectBody.result?.production_branch || null,
                domains: projectBody.result?.domains || [],
              } : { query_failed: true, status: projectResponse.status },
              production_deployment: latest ? {
                deployment_id: latest.id || null,
                environment: latest.environment || null,
                url: latest.url || null,
                latest_stage: latest.latest_stage || null,
                branch: latest.deployment_trigger?.metadata?.branch || null,
                commit_hash: latest.deployment_trigger?.metadata?.commit_hash || null,
              } : { query_failed: true, status: deploymentsResponse.status },
            };
          } else {
            report.cloudflare = { query_failed: true, reason: 'token-missing' };
          }
          console.log('## Pages staging deployment evidence');
          console.log('```json');
          console.log(JSON.stringify(report, null, 2));
          console.log('```');
          NODE
          gh api "repos/${GITHUB_REPOSITORY}/issues/${EVIDENCE_ISSUE}/comments" -f body="$(cat /tmp/pages-evidence.md)"
