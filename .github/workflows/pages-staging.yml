name: Pages Staging Deploy

on:
  push:
    branches: [main, feat/astera-translation]
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: pages-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 9 &&
       github.event.comment.body == '/deploy-staging' &&
       github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_PREVIEW_WITHOUT_AUTH: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREACCOUNTAPI }}
      CLOUDFLARE_ACCOUNT_ID: '6749a1289acc6c158a4621c26c3fbe08'
      EVIDENCE_ISSUE: '9'
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Require deploy credentials
        id: credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLAREACCOUNTAPI secret is empty" >&2
            exit 1
          fi

      - name: Install dependencies
        id: install
        run: npm install --no-audit

      - name: Build frontend
        id: frontend_build
        run: npm run build

      - name: Build Cloudflare Functions
        id: functions_build
        run: npm run cloudflare:functions:build

      - name: Deploy to authoritative staging Pages project
        id: pages_deploy
        run: npx wrangler pages deploy pages-dist --project-name=astera-app-staging --branch="${GITHUB_REF_NAME}"

      - name: Remove duplicate GitHub Pages project
        id: dedupe_pages
        if: steps.pages_deploy.outcome == 'success' && github.ref_name == 'feat/astera-translation'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const canonicalProject = 'astera-app-staging';
          const duplicateProject = 'astera-app-github';
          const base = `https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects`;
          const headers = { Authorization: `Bearer ${token}`, Accept: 'application/json' };

          async function readProject(name) {
            const response = await fetch(`${base}/${name}`, { headers });
            if (response.status === 404) return null;
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success === false) {
              throw new Error(`Cloudflare project read failed for ${name}: HTTP ${response.status}`);
            }
            return body.result ?? null;
          }

          const canonical = await readProject(canonicalProject);
          if (!canonical) throw new Error(`Canonical Pages project ${canonicalProject} is missing`);

          const duplicate = await readProject(duplicateProject);
          if (!duplicate) {
            console.log(`${duplicateProject} is already absent; Pages topology is already single-project.`);
            process.exit(0);
          }

          const domains = Array.isArray(duplicate.domains) ? duplicate.domains.filter((value) => typeof value === 'string') : [];
          const customDomains = domains.filter((domain) => !domain.endsWith('.pages.dev'));
          if (customDomains.length > 0) {
            throw new Error(`Refusing to delete ${duplicateProject}; custom domains are attached: ${customDomains.join(', ')}`);
          }

          let deleted = false;
          let lastStatus = 0;
          for (let attempt = 1; attempt <= 5; attempt += 1) {
            const response = await fetch(`${base}/${duplicateProject}`, { method: 'DELETE', headers });
            lastStatus = response.status;
            if (response.status === 404) {
              deleted = true;
              break;
            }
            const body = await response.json().catch(() => ({}));
            if (response.ok && body.success !== false) {
              deleted = true;
              break;
            }
            if (attempt < 5) await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          if (!deleted) throw new Error(`Failed to delete duplicate Pages project ${duplicateProject}; last HTTP status ${lastStatus}`);

          const after = await readProject(duplicateProject);
          if (after) throw new Error(`Duplicate Pages project ${duplicateProject} still exists after delete`);
          console.log(`Deleted duplicate Pages project ${duplicateProject}. Canonical project remains ${canonicalProject}.`);
          NODE

      - name: Report deployment evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          FRONTEND_BUILD_OUTCOME: ${{ steps.frontend_build.outcome }}
          FUNCTIONS_BUILD_OUTCOME: ${{ steps.functions_build.outcome }}
          PAGES_DEPLOY_OUTCOME: ${{ steps.pages_deploy.outcome }}
          DEDUPE_OUTCOME: ${{ steps.dedupe_pages.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/pages-evidence.md
          const token = process.env.CLOUDFLARE_API_TOKEN || '';
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const project = 'astera-app-staging';
          const duplicateProject = 'astera-app-github';
          const report = {
            github_sha: process.env.GITHUB_SHA,
            steps: {
              checkout: process.env.CHECKOUT_OUTCOME,
              setup_node: process.env.NODE_OUTCOME,
              credentials: process.env.CREDENTIALS_OUTCOME,
              install: process.env.INSTALL_OUTCOME,
              frontend_build: process.env.FRONTEND_BUILD_OUTCOME,
              functions_build: process.env.FUNCTIONS_BUILD_OUTCOME,
              pages_deploy: process.env.PAGES_DEPLOY_OUTCOME,
              dedupe_pages: process.env.DEDUPE_OUTCOME,
            },
            cloudflare: null,
            duplicate_project_exists: null,
          };
          if (token) {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/${project}/deployments?env=production`, {
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
            });
            const body = await response.json().catch(() => ({}));
            if (response.ok && body.success !== false && Array.isArray(body.result)) {
              const latest = body.result[0] || null;
              report.cloudflare = latest ? {
                deployment_id: latest.id || null,
                environment: latest.environment || null,
                url: latest.url || null,
                created_on: latest.created_on || null,
                latest_stage: latest.latest_stage ? {
                  name: latest.latest_stage.name || null,
                  status: latest.latest_stage.status || null,
                  ended_on: latest.latest_stage.ended_on || null,
                } : null,
                branch: latest.deployment_trigger?.metadata?.branch || null,
                commit_hash: latest.deployment_trigger?.metadata?.commit_hash || null,
              } : null;
            } else {
              report.cloudflare = { query_failed: true, status: response.status, errors: (body.errors || []).map((e) => e.code || e.message || 'unknown') };
            }

            const duplicateResponse = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/${duplicateProject}`, {
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
            });
            report.duplicate_project_exists = duplicateResponse.status !== 404;
          } else {
            report.cloudflare = { query_failed: true, reason: 'token-missing' };
          }
          console.log('## Pages staging deployment evidence');
          console.log('```json');
          console.log(JSON.stringify(report, null, 2));
          console.log('```');
          NODE
          gh api "repos/${GITHUB_REPOSITORY}/issues/${EVIDENCE_ISSUE}/comments" -f body="$(cat /tmp/pages-evidence.md)"
