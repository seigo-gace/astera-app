name: Pages Staging Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_PREVIEW_WITHOUT_AUTH: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREACCOUNTAPI }}
      CLOUDFLARE_ACCOUNT_ID: '6749a1289acc6c158a4621c26c3fbe08'
      ASTERAKEY: ${{ secrets.ASTERAKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Require deploy credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLAREACCOUNTAPI secret is empty" >&2
            exit 1
          fi
          if [ -z "${ASTERAKEY}" ]; then
            echo "ASTERAKEY secret is empty" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit

      - name: Build frontend
        run: npm run build

      - name: Build Cloudflare Functions
        run: npm run cloudflare:functions:build

      - name: Bootstrap AsteraTest Square billing variants
        run: node scripts/square-sandbox-bootstrap.mjs

      - name: Apply annual billing D1 schema once
        run: |
          if npx wrangler d1 execute ASTERA_DB --remote --command "SELECT billing_cycle FROM tenant_subscriptions LIMIT 0;" >/tmp/annual-schema-check.log 2>&1; then
            echo "Annual billing schema already applied"
          else
            npx wrangler d1 execute ASTERA_DB --remote --file migrations/d1/0013_annual_billing_variants.sql
          fi

      - name: Sync Square variation mapping to D1
        run: npx wrangler d1 execute ASTERA_DB --remote --file audit-results/square-sandbox-billing-map.sql

      - name: Sync Square Sandbox runtime secrets
        run: |
          printf '%s' "${ASTERAKEY}" | npx wrangler pages secret put SQUARE_ACCESS_TOKEN --project-name=astera-app-staging
          LOCATION_ID="$(tr -d '\r\n' < audit-results/square-sandbox-location.txt)"
          test -n "${LOCATION_ID}"
          printf '%s' "${LOCATION_ID}" | npx wrangler pages secret put SQUARE_LOCATION_ID --project-name=astera-app-staging

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=astera-app-staging --branch=main
