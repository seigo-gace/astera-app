name: Development Probe

on:
  issues:
    types: [opened, reopened]
  pull_request:
    paths:
      - '.github/workflows/dev-probe.yml'
      - 'docs/TGSERVER_ZERO_DEVELOPMENT_EVIDENCE.md'

permissions:
  contents: read
  issues: write

concurrency:
  group: dev-probe-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[DEV-PROBE]')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Record probe context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "canonical_verify=npm run verify"
          } > reports/dev-probe-context.txt

      - name: Project canonical verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          npm run verify 2>&1 | tee reports/dev-probe-verify.log

      - name: Upload project verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-probe-${{ github.run_id }}
          path: |
            reports/dev-probe-context.txt
            reports/dev-probe-verify.log
            audit-results/**
            playwright-report/**
            test-results/**
            coverage/**
          if-no-files-found: error
          retention-days: 3

      - name: Comment success and close request
        if: github.event_name == 'issues' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Development Probe passed.\n\nWorkflow run: ${runUrl}\nArtifact: dev-probe-${context.runId}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Comment failure without closing request
        if: github.event_name == 'issues' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Development Probe failed. The request remains open.\n\nWorkflow run: ${runUrl}`,
            });
