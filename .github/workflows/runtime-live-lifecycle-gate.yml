name: Runtime Live Lifecycle Gate

on:
  workflow_run:
    workflows: ["Pages Staging Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-live-lifecycle-gate
  cancel-in-progress: true

jobs:
  live-lifecycle:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREACCOUNTAPI }}
      CLOUDFLARE_PAGES_PROJECT: 'astera-app-staging'
      STAGING_DOMAIN: 'staging.asterav8.jp'
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout deployed main source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Require Cloudflare deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"

      - name: Install and build exact deployed source
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-fund --no-audit
          npm run build
          printf '{"github_sha":"%s","branch":"main","auth_mode":"real"}\n' "${TARGET_SHA}" > dist/__staging_deployment.json

      - name: Generate ephemeral protected lifecycle probe
        shell: bash
        run: |
          set -euo pipefail
          probe_key="$(openssl rand -hex 32)"
          echo "::add-mask::${probe_key}"
          probe_hash="$(printf '%s' "${probe_key}" | sha256sum | awk '{print $1}')"
          printf 'RUNTIME_E2E_PROBE_KEY=%s\n' "${probe_key}" >> "${GITHUB_ENV}"

          cat > functions/api/runtime/live-e2e.ts <<'EOF'
          import {
            cancelRuntimeJob,
            createRuntimeJob,
            getRuntimeJob,
            type RuntimeEnv,
            type RuntimeJobEnvelope,
          } from '../../_runtime';

          type PagesContext = { request: Request; env: RuntimeEnv };
          const EXPECTED_KEY_SHA256 = '__PROBE_HASH__';

          async function sha256Hex(value: string): Promise<string> {
            const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(value));
            return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('');
          }

          function sameJob(expected: string, value: RuntimeJobEnvelope): boolean {
            return value.runtime_job_id === expected;
          }

          function safeError(error: unknown): { code: string; message: string; error_class: string } {
            const source = error && typeof error === 'object' ? error as { code?: unknown; message?: unknown; name?: unknown } : {};
            const code = typeof source.code === 'string' ? source.code.slice(0, 96) : 'RUNTIME_E2E_FAILED';
            const raw = typeof source.message === 'string' ? source.message : String(error);
            return {
              code,
              message: raw.replace(/https?:\/\/[^\s"']+/gi, '[url]').slice(0, 240),
              error_class: typeof source.name === 'string' ? source.name.slice(0, 80) : 'UnknownThrown',
            };
          }

          async function rawRuntimeProbe(env: RuntimeEnv, method: 'GET' | 'POST'): Promise<Record<string, unknown>> {
            const origin = env.ASTERA_RUNTIME_ORIGIN?.trim() ?? '';
            const token = env.ASTERA_RUNTIME_SERVICE_TOKEN?.trim() ?? '';
            if (!origin || !token) return { http: 0, code: 'RUNTIME_BINDING_MISSING' };
            const path = method === 'GET'
              ? '/internal/v1/jobs/__raw_method_probe_never_created__'
              : '/internal/v1/jobs';
            const response = await fetch(new URL(path, origin).toString(), {
              method,
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/json',
                'Content-Type': 'application/json',
                'X-Correlation-ID': 'runtime-live-e2e-raw-method-probe',
              },
              ...(method === 'POST' ? { body: '{}' } : {}),
              redirect: 'manual',
            });
            const raw = await response.text();
            let payload: unknown = null;
            try { payload = JSON.parse(raw); } catch {}
            const root = payload && typeof payload === 'object' && !Array.isArray(payload) ? payload as Record<string, unknown> : {};
            const error = root.error && typeof root.error === 'object' && !Array.isArray(root.error) ? root.error as Record<string, unknown> : {};
            return {
              http: response.status,
              content_type: (response.headers.get('content-type') ?? '').slice(0, 120),
              cf_mitigated: (response.headers.get('cf-mitigated') ?? '').slice(0, 80) || null,
              server: (response.headers.get('server') ?? '').slice(0, 80) || null,
              location_present: Boolean(response.headers.get('location')),
              json: Object.keys(root).length > 0,
              error_code: typeof error.code === 'string' ? error.code.slice(0, 96) : null,
              body_length: raw.length,
            };
          }

          export async function onRequestPost(context: PagesContext): Promise<Response> {
            try {
              const supplied = context.request.headers.get('X-Astera-Runtime-E2E-Key')?.trim() ?? '';
              if (!supplied || await sha256Hex(supplied) !== EXPECTED_KEY_SHA256) {
                return Response.json({ error: { code: 'ROUTE_NOT_FOUND' } }, { status: 404 });
              }

              const [rawGet, rawPost] = await Promise.all([
                rawRuntimeProbe(context.env, 'GET'),
                rawRuntimeProbe(context.env, 'POST'),
              ]);
              const rawPostReachedRuntime = rawPost.http === 422 && rawPost.error_code === 'PURPOSE_INVALID';
              if (!rawPostReachedRuntime) {
                return Response.json({ ok: false, phase: 'raw_method_probe', raw_get: rawGet, raw_post: rawPost }, { status: 502 });
              }

              const jobId = crypto.randomUUID();
              const requestId = `runtime-live-e2e:${jobId}`;
              const correlationId = `runtime-live-e2e:${jobId}`;
              const created = await createRuntimeJob(context.env, {
                job_id: jobId,
                tenant_id: 'runtime-live-e2e',
                user_id: 'runtime-live-e2e',
                request_id: requestId,
                prompt: 'Astera Runtime live lifecycle probe. Validate the normal fixed Main8 execution path.',
                purpose: 'verify',
                options: [],
                files: [],
                private_mode: false,
                project_id: null,
                reserved_credits: 1,
                policy_version: 'runtime-live-e2e',
                correlation_id: correlationId,
              });
              const fetched = await getRuntimeJob(context.env, jobId, correlationId);
              const cancelled = await cancelRuntimeJob(context.env, jobId, correlationId);
              const final = await getRuntimeJob(context.env, jobId, correlationId);
              const identityOk = [created, fetched, cancelled, final].every((value) => sameJob(jobId, value));
              if (!identityOk) return Response.json({ ok: false, phase: 'lifecycle', code: 'RUNTIME_E2E_JOB_ID_DIVERGED', raw_get: rawGet, raw_post: rawPost }, { status: 502 });
              if (fetched.error?.code === 'RUNTIME_STATE_LOST_AFTER_RESTART' || final.error?.code === 'RUNTIME_STATE_LOST_AFTER_RESTART') {
                return Response.json({ ok: false, phase: 'lifecycle', code: 'RUNTIME_E2E_STATE_LOST', raw_get: rawGet, raw_post: rawPost }, { status: 502 });
              }
              return Response.json({
                ok: true,
                raw_get: rawGet,
                raw_post: rawPost,
                create_state: created.state,
                get_state: fetched.state,
                cancel_state: cancelled.state,
                final_state: final.state,
                final_error_code: final.error?.code ?? null,
              }, { headers: { 'Cache-Control': 'no-store' } });
            } catch (error) {
              return Response.json({ ok: false, phase: 'exception', ...safeError(error) }, { status: 502, headers: { 'Cache-Control': 'no-store' } });
            }
          }

          export function onRequest(context: PagesContext): Promise<Response> {
            if (context.request.method !== 'POST') return Promise.resolve(Response.json({ error: { code: 'ROUTE_NOT_FOUND' } }, { status: 404 }));
            return onRequestPost(context);
          }
          EOF
          sed -i "s/__PROBE_HASH__/${probe_hash}/" functions/api/runtime/live-e2e.ts

      - name: Build and deploy ephemeral probe
        shell: bash
        run: |
          set -euo pipefail
          npm run cloudflare:functions:build
          deploy_output="$(npx wrangler pages deploy dist --project-name="${CLOUDFLARE_PAGES_PROJECT}" --branch=main 2>&1)"
          printf '%s\n' "${deploy_output}"
          deployment_url="$(printf '%s\n' "${deploy_output}" | grep -Eo 'https://[a-f0-9]+\.astera-app-staging\.pages\.dev' | tail -n 1)"
          test -n "${deployment_url}"
          printf 'RUNTIME_E2E_DEPLOYMENT_URL=%s\n' "${deployment_url}" >> "${GITHUB_ENV}"

      - name: Execute live create get cancel lifecycle
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const key = process.env.RUNTIME_E2E_PROBE_KEY;
          const targets = [
            ['DEPLOYMENT_URL', process.env.RUNTIME_E2E_DEPLOYMENT_URL],
            ['CUSTOM_DOMAIN', `https://${process.env.STAGING_DOMAIN}`],
          ];
          const safeText = (value) => String(value || '').replace(/https?:\/\/[^\s"']+/gi, '[url]').slice(0, 300);
          const outcomes = [];
          for (const [label, base] of targets) {
            let final = null;
            for (let attempt = 1; attempt <= 8; attempt += 1) {
              try {
                const response = await fetch(`${base}/api/runtime/live-e2e?attempt=${attempt}`, {
                  method: 'POST',
                  headers: {
                    'X-Astera-Runtime-E2E-Key': key,
                    'Content-Type': 'application/json',
                    'Cache-Control': 'no-cache',
                  },
                  body: '{}',
                });
                const raw = await response.text();
                let body = null;
                try { body = JSON.parse(raw); } catch {}
                final = {
                  label,
                  http: response.status,
                  content_type: (response.headers.get('content-type') || '').slice(0, 120),
                  cf_ray_present: Boolean(response.headers.get('cf-ray')),
                  body,
                  safe_text: body ? '' : safeText(raw),
                };
                if (response.ok && body?.ok === true) break;
              } catch (error) {
                final = { label, fetch_error: safeText(error instanceof Error ? error.message : String(error)) };
              }
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }
            outcomes.push(final);
            console.log(`${label}_SAFE_RESULT=${JSON.stringify(final)}`);
          }
          const passed = outcomes.find((item) => item?.http === 200 && item?.body?.ok === true);
          if (!passed) throw new Error('RUNTIME_LIVE_CREATE_GET_CANCEL_GATE_FAILED');
          console.log(`RUNTIME_LIVE_CREATE_STATE=${passed.body.create_state}`);
          console.log(`RUNTIME_LIVE_GET_STATE=${passed.body.get_state}`);
          console.log(`RUNTIME_LIVE_CANCEL_STATE=${passed.body.cancel_state}`);
          console.log(`RUNTIME_LIVE_FINAL_STATE=${passed.body.final_state}`);
          console.log(`RUNTIME_LIVE_FINAL_ERROR_CODE=${passed.body.final_error_code ?? 'NONE'}`);
          console.log('RUNTIME_LIVE_CREATE_GET_CANCEL_GATE=PASS');
          NODE

      - name: Remove ephemeral probe and redeploy clean source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f functions/api/runtime/live-e2e.ts
          npm run cloudflare:functions:build
          npx wrangler pages deploy dist --project-name="${CLOUDFLARE_PAGES_PROJECT}" --branch=main

      - name: Verify clean final deployment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const domain = process.env.STAGING_DOMAIN;
          const expectedSha = process.env.TARGET_SHA;
          const key = process.env.RUNTIME_E2E_PROBE_KEY;
          let markerOk = false;
          let probeRemoved = false;
          let last = '';
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const markerResponse = await fetch(`https://${domain}/__staging_deployment.json?cleanup=${attempt}`, { headers: { 'Cache-Control': 'no-cache' } });
              const marker = await markerResponse.json().catch(() => ({}));
              const probeResponse = await fetch(`https://${domain}/api/runtime/live-e2e?cleanup=${attempt}`, {
                method: 'POST',
                headers: { 'X-Astera-Runtime-E2E-Key': key, 'Content-Type': 'application/json', 'Cache-Control': 'no-cache' },
                body: '{}',
              });
              markerOk = markerResponse.ok && marker.github_sha === expectedSha && marker.branch === 'main';
              probeRemoved = probeResponse.status === 404;
              last = `marker=${markerResponse.status}/${marker.github_sha || 'missing'} probe_post=${probeResponse.status}`;
              if (markerOk && probeRemoved) break;
            } catch (error) {
              last = error instanceof Error ? error.message : String(error);
            }
            await new Promise((resolve) => setTimeout(resolve, 2500));
          }
          if (!markerOk || !probeRemoved) throw new Error(`FINAL_CLEAN_DEPLOYMENT_VERIFY_FAILED: ${last}`);
          console.log('RUNTIME_LIVE_E2E_EPHEMERAL_ROUTE_REMOVED=PASS');
          console.log('RUNTIME_LIVE_E2E_FINAL_DEPLOYMENT_SHA=PASS');
          NODE
