name: Annual Billing Format Repair

on:
  push:
    branches:
      - feature/annual-billing-cycle

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-repair]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/annual-billing-cycle
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - name: Format annual billing changed sources
        run: |
          npx --yes prettier@3.6.2 --write \
            functions/_catalog.ts \
            functions/api/billing/checkout-intents.ts \
            functions/api/billing/webhooks/square.ts \
            src/features/checkout/CheckoutPage.tsx \
            src/features/checkout/checkout-page.css \
            src/features/checkout/checkout-text.ts \
            src/features/navigation/UtilityPages.tsx \
            src/features/navigation/plan-credit-page.css \
            src/features/navigation/plan-credit-text.ts
      - name: Commit formatting repair if needed
        run: |
          if git diff --quiet; then
            echo "No formatting repair required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            functions/_catalog.ts \
            functions/api/billing/checkout-intents.ts \
            functions/api/billing/webhooks/square.ts \
            src/features/checkout/CheckoutPage.tsx \
            src/features/checkout/checkout-page.css \
            src/features/checkout/checkout-text.ts \
            src/features/navigation/UtilityPages.tsx \
            src/features/navigation/plan-credit-page.css \
            src/features/navigation/plan-credit-text.ts
          git commit -m "chore(billing): restore readable formatting [format-repair]"
          git push origin HEAD:feature/annual-billing-cycle
