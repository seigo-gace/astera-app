name: Runtime Helper Phase Diagnostic

on:
  workflow_run:
    workflows: ["Runtime Live Lifecycle Gate"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: runtime-helper-phase-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREACCOUNTAPI }}
      CLOUDFLARE_PAGES_PROJECT: astera-app-staging
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - name: Build and generate protected helper probe
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          npm install --no-fund --no-audit
          npm run build
          printf '{"github_sha":"%s","branch":"main","auth_mode":"real"}\n' "${TARGET_SHA}" > dist/__staging_deployment.json
          key="$(openssl rand -hex 32)"
          echo "::add-mask::${key}"
          hash="$(printf '%s' "${key}"|sha256sum|awk '{print $1}')"
          printf 'HELPER_PHASE_KEY=%s\n' "${key}" >> "${GITHUB_ENV}"
          cat > functions/api/runtime/helper-phase.ts <<'EOF'
          import {createRuntimeJob,getRuntimeJob,cancelRuntimeJob,type RuntimeEnv} from '../../_runtime';
          type C={request:Request;env:RuntimeEnv};
          const H='__PROBE_HASH__';
          async function hex(v:string){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return Array.from(new Uint8Array(d),b=>b.toString(16).padStart(2,'0')).join('')}
          function safe(e:unknown){const x=e&&typeof e==='object'?e as {code?:unknown;message?:unknown;name?:unknown}:{};return{code:typeof x.code==='string'?x.code.slice(0,96):'RUNTIME_HELPER_PHASE_FAILED',message:(typeof x.message==='string'?x.message:String(e)).replace(/https?:\/\/[^\s"']+/gi,'[url]').slice(0,240),error_class:typeof x.name==='string'?x.name.slice(0,80):'UnknownThrown'}}
          export async function onRequestPost(c:C){const k=c.request.headers.get('X-Astera-Helper-Phase-Key')?.trim()??'';if(!k||await hex(k)!==H)return Response.json({error:{code:'ROUTE_NOT_FOUND'}},{status:404});const id=crypto.randomUUID(),corr=crypto.randomUUID();let phase='create';const states:Record<string,unknown>={};try{const created=await createRuntimeJob(c.env,{job_id:id,tenant_id:'runtime-helper-phase',user_id:'runtime-helper-phase',request_id:corr,prompt:'Runtime helper lifecycle diagnostic.',purpose:'verify',options:[],files:[],private_mode:false,project_id:null,reserved_credits:1,policy_version:'runtime-helper-phase',correlation_id:corr});states.create=created.state;phase='get';const got=await getRuntimeJob(c.env,id,corr);states.get=got.state;phase='cancel';const cancelled=await cancelRuntimeJob(c.env,id,corr);states.cancel=cancelled.state;phase='final_get';const final=await getRuntimeJob(c.env,id,corr);states.final=final.state;return Response.json({kind:'runtime_helper_phase',ok:true,states},{headers:{'Cache-Control':'no-store'}})}catch(e){return Response.json({kind:'runtime_helper_phase',ok:false,phase,...safe(e),states},{status:502,headers:{'Cache-Control':'no-store'}})}}
          export function onRequest(c:C){return c.request.method==='POST'?onRequestPost(c):Promise.resolve(Response.json({error:{code:'ROUTE_NOT_FOUND'}},{status:404}))}
          EOF
          sed -i "s/__PROBE_HASH__/${hash}/" functions/api/runtime/helper-phase.ts
      - name: Deploy and execute helper probe
        shell: bash
        run: |
          set -euo pipefail
          npm run cloudflare:functions:build
          out="$(npx wrangler pages deploy dist --project-name="${CLOUDFLARE_PAGES_PROJECT}" --branch=main 2>&1)"
          printf '%s\n' "${out}"
          url="$(printf '%s\n' "${out}"|grep -Eo 'https://[a-f0-9]+\.astera-app-staging\.pages\.dev'|tail -n1)"
          test -n "${url}"
          export HELPER_PHASE_URL="${url}"
          node <<'NODE'
          const url=process.env.HELPER_PHASE_URL,key=process.env.HELPER_PHASE_KEY;let final=null;for(let a=1;a<=8;a++){const r=await fetch(`${url}/api/runtime/helper-phase?a=${a}`,{method:'POST',headers:{'X-Astera-Helper-Phase-Key':key,'Content-Type':'application/json','Cache-Control':'no-cache'},body:'{}'});const raw=await r.text();let b=null;try{b=JSON.parse(raw)}catch{}final={http:r.status,json:b!==null,body:b};if(b?.kind==='runtime_helper_phase')break;await new Promise(x=>setTimeout(x,2500))}console.log(`RUNTIME_HELPER_PHASE_SAFE=${JSON.stringify(final)}`);if(final?.body?.kind!=='runtime_helper_phase')throw new Error('RUNTIME_HELPER_PHASE_ENDPOINT_FAILED');
          NODE
      - name: Remove helper probe and redeploy clean source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f functions/api/runtime/helper-phase.ts
          npm run cloudflare:functions:build
          out="$(npx wrangler pages deploy dist --project-name="${CLOUDFLARE_PAGES_PROJECT}" --branch=main 2>&1)"
          printf '%s\n' "${out}"
          url="$(printf '%s\n' "${out}"|grep -Eo 'https://[a-f0-9]+\.astera-app-staging\.pages\.dev'|tail -n1)"
          test -n "${url}"
          printf 'HELPER_PHASE_CLEAN_URL=%s\n' "${url}" >> "${GITHUB_ENV}"
      - name: Verify cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base=process.env.HELPER_PHASE_CLEAN_URL,key=process.env.HELPER_PHASE_KEY,sha=process.env.TARGET_SHA;if(!base)throw new Error('CLEAN_URL_MISSING');const mr=await fetch(`${base}/__staging_deployment.json`),m=await mr.json().catch(()=>({}));const rr=await fetch(`${base}/api/runtime/helper-phase`,{method:'POST',headers:{'X-Astera-Helper-Phase-Key':key,'Content-Type':'application/json'},body:'{}'}),raw=await rr.text();let b=null;try{b=JSON.parse(raw)}catch{}const ok=mr.ok&&m.github_sha===sha&&m.branch==='main'&&b?.kind!=='runtime_helper_phase';console.log(`RUNTIME_HELPER_PHASE_CLEANUP_SAFE=${JSON.stringify({marker_http:mr.status,marker_sha_match:m.github_sha===sha,route_http:rr.status,diagnostic_marker_present:b?.kind==='runtime_helper_phase'})}`);if(!ok)throw new Error('RUNTIME_HELPER_PHASE_CLEANUP_FAILED');console.log('RUNTIME_HELPER_PHASE_EPHEMERAL_ROUTE_REMOVED=PASS');console.log('RUNTIME_HELPER_PHASE_FINAL_DEPLOYMENT_SHA=PASS');
          NODE
