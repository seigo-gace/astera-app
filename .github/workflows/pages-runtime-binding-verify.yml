name: Pages Runtime Binding Verify

on:
  pull_request:
    branches: [main]
    paths:
      - 'wrangler.toml'
      - '.github/workflows/pages-runtime-binding-verify.yml'
      - '.github/workflows/pages-staging.yml'
      - 'functions/_runtime.ts'
      - 'functions/api/runtime/status.ts'
  workflow_run:
    workflows: ["Pages Staging Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-authority:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_RUNTIME_ORIGIN: 'https://runtime.asterav8.jp'
    steps:
      - name: Checkout relevant source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || 'main' }}

      - name: Verify source runtime binding authority
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_RUNTIME_ORIGIN="${EXPECTED_RUNTIME_ORIGIN}" node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('wrangler.toml', 'utf8');
          const expected = `ASTERA_RUNTIME_ORIGIN = "${process.env.EXPECTED_RUNTIME_ORIGIN}"`;
          if (!source.split(/\r?\n/).some((line) => line.trim() === expected)) {
            throw new Error('WRANGLER_RUNTIME_ORIGIN_MISSING_OR_MISMATCHED');
          }
          if (/ASTERA_RUNTIME_SERVICE_TOKEN\s*=/.test(source)) {
            throw new Error('RUNTIME_SERVICE_TOKEN_MUST_NOT_BE_STORED_IN_WRANGLER');
          }
          const statusSource = fs.readFileSync('functions/api/runtime/status.ts', 'utf8');
          for (const marker of [
            'context.env.ASTERA_RUNTIME_ORIGIN',
            'context.env.ASTERA_RUNTIME_SERVICE_TOKEN',
            'runtime_origin_configured',
            'runtime_service_token_configured',
            'runtime_health_http',
            'runtime_auth_http',
            'runtime_auth_authenticated',
            'runtime_auth_response_code',
            'RUNTIME_STATE_LOST_AFTER_RESTART',
          ]) {
            if (!statusSource.includes(marker)) throw new Error(`LIVE_RUNTIME_STATUS_MARKER_MISSING:${marker}`);
          }
          console.log('WRANGLER_RUNTIME_ORIGIN=PASS');
          console.log('WRANGLER_RUNTIME_SERVICE_TOKEN=SECRET_ONLY');
          console.log('LIVE_RUNTIME_STATUS_SOURCE=PASS');
          console.log('PAGES_RUNTIME_SOURCE_AUTHORITY_GATE=PASS');
          NODE

  active-deployment:
    needs: source-authority
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREACCOUNTAPI }}
      CLOUDFLARE_ACCOUNT_ID: '6749a1289acc6c158a4621c26c3fbe08'
      CLOUDFLARE_PAGES_PROJECT: 'astera-app-staging'
      STAGING_DOMAIN: 'staging.asterav8.jp'
      EXPECTED_RUNTIME_ORIGIN: 'https://runtime.asterav8.jp'
      EXPECTED_BRANCH: 'main'
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || '' }}
    steps:
      - name: Verify metadata and both live Function routes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const projectName = process.env.CLOUDFLARE_PAGES_PROJECT;
          const stagingDomain = process.env.STAGING_DOMAIN;
          const token = process.env.CLOUDFLARE_API_TOKEN || '';
          const expectedOrigin = process.env.EXPECTED_RUNTIME_ORIGIN;
          const expectedBranch = process.env.EXPECTED_BRANCH;
          const expectedSha = process.env.EXPECTED_SHA || '';

          if (!token) throw new Error('CLOUDFLARE_API_TOKEN_MISSING');
          const headers = { Authorization: `Bearer ${token}`, Accept: 'application/json' };

          const [projectResponse, deploymentsResponse, runtimeHealthResponse] = await Promise.all([
            fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/${projectName}`, { headers }),
            fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/${projectName}/deployments?env=production&per_page=1`, { headers }),
            fetch(`${expectedOrigin}/health`, { headers: { Accept: 'application/json' } }),
          ]);

          const projectBody = await projectResponse.json().catch(() => ({}));
          const deploymentsBody = await deploymentsResponse.json().catch(() => ({}));
          const latest = Array.isArray(deploymentsBody.result) ? deploymentsBody.result[0] : null;

          if (!projectResponse.ok || projectBody.success === false) {
            throw new Error(`PAGES_PROJECT_READ_FAILED_HTTP_${projectResponse.status}`);
          }
          if (!deploymentsResponse.ok || deploymentsBody.success === false || !latest) {
            throw new Error(`PAGES_DEPLOYMENT_READ_FAILED_HTTP_${deploymentsResponse.status}`);
          }
          if (!runtimeHealthResponse.ok) {
            throw new Error(`RUNTIME_HEALTH_FAILED_HTTP_${runtimeHealthResponse.status}`);
          }

          const projectEnv = projectBody.result?.deployment_configs?.production?.env_vars || {};
          const projectOrigin = projectEnv.ASTERA_RUNTIME_ORIGIN;
          const projectToken = projectEnv.ASTERA_RUNTIME_SERVICE_TOKEN;
          if (!projectOrigin || projectOrigin.type !== 'plain_text' || projectOrigin.value !== expectedOrigin) {
            throw new Error('PROJECT_RUNTIME_ORIGIN_MISSING_OR_MISMATCHED');
          }
          if (!projectToken || projectToken.type !== 'secret_text') {
            throw new Error('PROJECT_RUNTIME_SERVICE_TOKEN_MISSING_OR_NOT_SECRET');
          }

          const deploymentEnv = latest.env_vars || {};
          const deploymentOrigin = deploymentEnv.ASTERA_RUNTIME_ORIGIN;
          const deploymentToken = deploymentEnv.ASTERA_RUNTIME_SERVICE_TOKEN;
          if (!deploymentOrigin || deploymentOrigin.type !== 'plain_text' || deploymentOrigin.value !== expectedOrigin) {
            throw new Error('ACTIVE_DEPLOYMENT_RUNTIME_ORIGIN_MISSING_OR_MISMATCHED');
          }
          if (!deploymentToken || deploymentToken.type !== 'secret_text') {
            throw new Error('ACTIVE_DEPLOYMENT_RUNTIME_SERVICE_TOKEN_MISSING_OR_NOT_SECRET');
          }

          const branch = latest.deployment_trigger?.metadata?.branch || '';
          const commitHash = latest.deployment_trigger?.metadata?.commit_hash || '';
          const stageStatus = latest.latest_stage?.status || '';
          const deploymentUrl = String(latest.url || '').replace(/\/$/, '');
          if (branch !== expectedBranch) throw new Error(`ACTIVE_DEPLOYMENT_BRANCH_MISMATCH:${branch || 'missing'}`);
          if (expectedSha && commitHash !== expectedSha) throw new Error(`ACTIVE_DEPLOYMENT_SHA_MISMATCH:${commitHash || 'missing'}`);
          if (stageStatus && stageStatus !== 'success') throw new Error(`ACTIVE_DEPLOYMENT_STAGE_NOT_SUCCESS:${stageStatus}`);
          if (!deploymentUrl.startsWith('https://')) throw new Error('ACTIVE_DEPLOYMENT_URL_MISSING');

          async function probe(label, base) {
            const response = await fetch(`${base}/api/runtime/status?sha=${encodeURIComponent(expectedSha || 'manual')}`, {
              headers: { Accept: 'application/json', 'Cache-Control': 'no-cache' },
            });
            const body = await response.json().catch(() => ({}));
            const result = {
              label,
              http: response.status,
              origin: body.runtime_origin_configured === true,
              token: body.runtime_service_token_configured === true,
              runtimeHealth: Number(body.runtime_health_http || 0),
              runtimeAuthHttp: Number(body.runtime_auth_http || 0),
              runtimeAuthenticated: body.runtime_auth_authenticated === true,
              runtimeAuthCode: typeof body.runtime_auth_response_code === 'string' ? body.runtime_auth_response_code : '',
            };
            console.log(`${label}_FUNCTION_HTTP=${result.http}`);
            console.log(`${label}_FUNCTION_RUNTIME_ORIGIN=${result.origin ? 'PRESENT' : 'MISSING'}`);
            console.log(`${label}_FUNCTION_RUNTIME_SERVICE_TOKEN=${result.token ? 'PRESENT' : 'MISSING'}`);
            console.log(`${label}_FUNCTION_RUNTIME_HEALTH_HTTP=${result.runtimeHealth}`);
            console.log(`${label}_FUNCTION_RUNTIME_AUTH_HTTP=${result.runtimeAuthHttp}`);
            console.log(`${label}_FUNCTION_RUNTIME_AUTHENTICATED=${result.runtimeAuthenticated}`);
            console.log(`${label}_FUNCTION_RUNTIME_AUTH_CODE=${result.runtimeAuthCode || 'MISSING'}`);
            return result;
          }

          const [custom, direct] = await Promise.all([
            probe('CUSTOM_DOMAIN', `https://${stagingDomain}`),
            probe('DEPLOYMENT_URL', deploymentUrl),
          ]);

          const authContractValid = (x) =>
            (x.runtimeAuthHttp === 404 && x.runtimeAuthCode === 'RUNTIME_JOB_NOT_FOUND') ||
            (x.runtimeAuthHttp === 200 && x.runtimeAuthCode === 'RUNTIME_STATE_LOST_AFTER_RESTART');
          const healthy = (x) =>
            x.http === 200 &&
            x.origin &&
            x.token &&
            x.runtimeHealth === 200 &&
            x.runtimeAuthenticated &&
            authContractValid(x);
          if (
            custom.origin !== direct.origin ||
            custom.token !== direct.token ||
            custom.runtimeHealth !== direct.runtimeHealth ||
            custom.runtimeAuthHttp !== direct.runtimeAuthHttp ||
            custom.runtimeAuthenticated !== direct.runtimeAuthenticated ||
            custom.runtimeAuthCode !== direct.runtimeAuthCode
          ) {
            throw new Error('CUSTOM_DOMAIN_AND_DEPLOYMENT_FUNCTION_ROUTE_DIVERGED');
          }
          if (!healthy(custom) || !healthy(direct)) {
            throw new Error('LIVE_FUNCTION_RUNTIME_BINDING_FAILED');
          }

          console.log('PROJECT_RUNTIME_ORIGIN=PRESENT TYPE=plain_text');
          console.log('PROJECT_RUNTIME_SERVICE_TOKEN=PRESENT TYPE=secret_text');
          console.log('ACTIVE_DEPLOYMENT_RUNTIME_ORIGIN=PRESENT TYPE=plain_text');
          console.log('ACTIVE_DEPLOYMENT_RUNTIME_SERVICE_TOKEN=PRESENT TYPE=secret_text');
          console.log(`ACTIVE_DEPLOYMENT_BRANCH=${branch}`);
          console.log(`ACTIVE_DEPLOYMENT_SHA_MATCH=${expectedSha ? String(commitHash === expectedSha) : 'NOT_REQUESTED'}`);
          console.log(`RUNTIME_HEALTH_HTTP=${runtimeHealthResponse.status}`);
          console.log('PAGES_RUNTIME_BINDING_GATE=PASS');
          NODE
