name: Staging Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Validate browser scripts
        run: |
          node --check public/app-interactions.js
          node --check public/process-user-errors.js
          node --check public/ui-honesty.js
          node --check public/guide-ai-runtime.js
      - name: Audit canonical routes
        run: npm run route:audit
      - name: Audit responsive behavior
        run: npm run responsive:audit
      - name: Audit device compatibility
        run: npm run device:audit
      - name: Audit mobile boundaries
        run: npm run mobile:audit
      - name: Audit user journeys
        run: npm run story:audit:strict
      - name: Typecheck contracts and Contabo runtime
        run: npm run contract:check
      - name: Build frontend
        run: npm run build
      - name: Build Cloudflare Pages Functions
        run: npm run cloudflare:functions:build
      - name: Build Contabo runtime
        run: npm run contabo:build
      - name: Test Contabo runtime
        run: npm run contabo:test
      - name: Run Contabo runtime smoke
        run: npm --prefix contabo/app-api run smoke
      - name: Build non-root Contabo container
        run: docker build -f contabo/app-api/Dockerfile .
      - name: Enforce source gate
        run: npm run notion:audit:strict
      - name: Require staging endpoint configuration
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "${STAGING_BASE_URL:-}" ]; then
            echo "STAGING_BASE_URL repository variable is required for runtime reachability verification." >&2
            exit 1
          fi
      - name: Verify frontend-to-backend endpoint reachability
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.STAGING_BASE_URL;
          const probes = [
            { path: '/api/catalog/public', allowed: new Set([200]) },
            { path: '/api/account', allowed: new Set([200, 401, 403]) },
            { path: '/api/credit/balance', allowed: new Set([200, 401, 403]) },
            { path: '/api/credit/ledger', allowed: new Set([200, 401, 403]) },
            { path: '/api/projects', allowed: new Set([200, 401, 403]) },
            { path: '/api/history', allowed: new Set([200, 401, 403]) },
            { path: '/api/templates', allowed: new Set([200, 401, 403]) },
            { path: '/api/preferences', allowed: new Set([200, 401, 403]) },
            { path: '/api/storage/destinations', allowed: new Set([200, 401, 403]) },
            { path: '/api/developer/catalog', allowed: new Set([200, 401, 403]) },
            { path: '/api/shares', allowed: new Set([200, 401, 403]) },
            { path: '/api/legal', allowed: new Set([200]) },
            { path: '/api/status', allowed: new Set([200]) },
          ];
          const hardFailureCodes = new Set([
            'API_ROUTE_NOT_FOUND',
            'LOCAL_API_ROUTE_NOT_BOUND',
            'APP_API_ORIGIN_NOT_CONFIGURED',
            'APP_API_SERVICE_TOKEN_NOT_CONFIGURED',
            'APP_API_UPSTREAM_UNAVAILABLE',
            'APP_API_UPSTREAM_TIMEOUT',
          ]);
          const failures = [];
          for (const probe of probes) {
            const url = new URL(probe.path, base).toString();
            try {
              const response = await fetch(url, {
                method: 'GET',
                redirect: 'manual',
                headers: { 'Cache-Control': 'no-cache', 'X-Reachability-Probe': 'staging-gate' },
                signal: AbortSignal.timeout(10_000),
              });
              let code = null;
              const contentType = response.headers.get('content-type') || '';
              if (contentType.includes('application/json')) {
                try {
                  const body = await response.clone().json();
                  code = body?.error?.code || null;
                } catch {
                  code = null;
                }
              }
              if (!probe.allowed.has(response.status) || (code && hardFailureCodes.has(code))) {
                failures.push(`${probe.path}: HTTP ${response.status}${code ? ` ${code}` : ''}`);
              } else {
                console.log(`PASS ${probe.path}: HTTP ${response.status}${code ? ` ${code}` : ''}`);
              }
            } catch (error) {
              failures.push(`${probe.path}: ${error instanceof Error ? error.message : String(error)}`);
            }
          }
          if (failures.length) {
            console.error('Frontend -> Backend endpoint reachability gate failed:');
            for (const failure of failures) console.error(`- ${failure}`);
            process.exit(1);
          }
          NODE
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser device and user journey matrix
        run: npm run e2e:devices
