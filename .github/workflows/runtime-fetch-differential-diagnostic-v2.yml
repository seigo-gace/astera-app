name: Runtime Fetch Differential Diagnostic V2

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-fetch-differential-diagnostic-v2
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREACCOUNTAPI }}
      CLOUDFLARE_PAGES_PROJECT: astera-app-staging
      TARGET_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - name: Build and generate protected differential probe
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          npm install --no-fund --no-audit
          npm run build
          printf '{"github_sha":"%s","branch":"main","auth_mode":"real"}\n' "${TARGET_SHA}" > dist/__staging_deployment.json
          probe_key="$(openssl rand -hex 32)"
          echo "::add-mask::${probe_key}"
          probe_hash="$(printf '%s' "${probe_key}" | sha256sum | awk '{print $1}')"
          printf 'RUNTIME_DIFF_KEY=%s\n' "${probe_key}" >> "${GITHUB_ENV}"
          cat > functions/api/runtime/fetch-diff-v2.ts <<'EOF'
          import type { RuntimeEnv } from '../../_runtime';
          type C={request:Request;env:RuntimeEnv};
          const H='__PROBE_HASH__';
          async function hex(v:string){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return Array.from(new Uint8Array(d),b=>b.toString(16).padStart(2,'0')).join('')}
          const obj=(v:unknown):Record<string,unknown>=>v&&typeof v==='object'&&!Array.isArray(v)?v as Record<string,unknown>:{};
          function body(id:string,mode:'base'|'safe'|'orig'){const life=mode!=='base';return{job_id:id,tenant_id:life?'runtime-live-e2e':'runtime-fetch-diff',user_id:life?'runtime-live-e2e':'runtime-fetch-diff',request_id:`${life?'runtime-live-e2e':'runtime-fetch-diff'}:${id}`,prompt:mode==='orig'?'Astera Runtime live lifecycle probe. Validate the normal fixed Main8 execution path.':mode==='safe'?'Runtime live lifecycle diagnostic.':'Runtime fetch differential diagnostic.',purpose:'verify',options:[],files:[],private_mode:false,project_id:null,reserved_credits:1,policy_version:life?'runtime-live-e2e':'runtime-fetch-diff',correlation_id:`${life?'runtime-live-e2e':'runtime-fetch-diff'}:${id}`}}
          async function call(env:RuntimeEnv,b:Record<string,unknown>,corr:string,manual:boolean,signal:boolean){const o=env.ASTERA_RUNTIME_ORIGIN?.trim()??'',t=env.ASTERA_RUNTIME_SERVICE_TOKEN?.trim()??'';if(!o||!t)return{http:0,error_code:'RUNTIME_BINDING_MISSING'};const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort('timeout'),15000);try{const r=await fetch(new URL('/internal/v1/jobs',o).toString(),{method:'POST',headers:{Authorization:`Bearer ${t}`,Accept:'application/json','Content-Type':'application/json','X-Correlation-ID':corr},body:JSON.stringify(b),...(manual?{redirect:'manual' as const}:{}),...(signal?{signal:ctl.signal}:{})});const raw=await r.text();let p:unknown=null;try{p=JSON.parse(raw)}catch{}const root=obj(p),e=obj(root.error),j=obj(root.job);return{http:r.status,content_type:(r.headers.get('content-type')??'').slice(0,100),server:(r.headers.get('server')??'').slice(0,80)||null,cf_mitigated:(r.headers.get('cf-mitigated')??'').slice(0,80)||null,location_present:Boolean(r.headers.get('location')),json:Object.keys(root).length>0,error_code:typeof e.code==='string'?e.code.slice(0,96):null,job_present:Object.keys(j).length>0,body_length:raw.length}}catch(e){return{http:0,fetch_error:e instanceof Error?e.name:'UnknownThrown'}}finally{clearTimeout(timer)}}
          async function cancel(env:RuntimeEnv,id:string,r:Record<string,unknown>){if(r.http!==200&&r.http!==201)return;const o=env.ASTERA_RUNTIME_ORIGIN?.trim()??'',t=env.ASTERA_RUNTIME_SERVICE_TOKEN?.trim()??'';if(!o||!t)return;await fetch(new URL(`/internal/v1/jobs/${encodeURIComponent(id)}/cancel`,o).toString(),{method:'POST',headers:{Authorization:`Bearer ${t}`,Accept:'application/json','Content-Type':'application/json','X-Correlation-ID':crypto.randomUUID()},body:'{}',redirect:'manual'}).catch(()=>undefined)}
          export async function onRequestPost(c:C){const k=c.request.headers.get('X-Astera-Runtime-Diff-Key')?.trim()??'';if(!k||await hex(k)!==H)return Response.json({error:{code:'ROUTE_NOT_FOUND'}},{status:404});const cases:[string,'base'|'safe'|'orig','simple'|'uuid'|'life',boolean,boolean][]=[['baseline_manual','base','simple',true,false],['baseline_follow','base','simple',false,false],['baseline_signal','base','simple',false,true],['lifecycle_safe_prompt','safe','simple',true,false],['lifecycle_original_prompt','orig','simple',true,false],['lifecycle_uuid_header','orig','uuid',true,false],['lifecycle_header','orig','life',true,false],['lifecycle_helper_shape','orig','life',false,true]];const results:Record<string,unknown>={};for(const [name,mode,hm,manual,signal] of cases){const id=crypto.randomUUID(),b=body(id,mode),h=hm==='simple'?'runtime-fetch-differential':hm==='uuid'?crypto.randomUUID():`runtime-live-e2e:${id}`;const r=await call(c.env,b,h,manual,signal);results[name]=r;await cancel(c.env,id,r)}return Response.json({kind:'runtime_fetch_differential_v2',ok:true,results},{headers:{'Cache-Control':'no-store'}})}
          export function onRequest(c:C){return c.request.method==='POST'?onRequestPost(c):Promise.resolve(Response.json({error:{code:'ROUTE_NOT_FOUND'}},{status:404}))}
          EOF
          sed -i "s/__PROBE_HASH__/${probe_hash}/" functions/api/runtime/fetch-diff-v2.ts
      - name: Deploy and execute differential probe
        shell: bash
        run: |
          set -euo pipefail
          npm run cloudflare:functions:build
          output="$(npx wrangler pages deploy dist --project-name="${CLOUDFLARE_PAGES_PROJECT}" --branch=main 2>&1)"
          printf '%s\n' "${output}"
          url="$(printf '%s\n' "${output}" | grep -Eo 'https://[a-f0-9]+\.astera-app-staging\.pages\.dev' | tail -n 1)"
          test -n "${url}"
          export RUNTIME_DIFF_URL="${url}"
          node <<'NODE'
          const url=process.env.RUNTIME_DIFF_URL,key=process.env.RUNTIME_DIFF_KEY;let final=null;
          for(let a=1;a<=8;a++){const r=await fetch(`${url}/api/runtime/fetch-diff-v2?attempt=${a}`,{method:'POST',headers:{'X-Astera-Runtime-Diff-Key':key,'Content-Type':'application/json','Cache-Control':'no-cache'},body:'{}'});const raw=await r.text();let body=null;try{body=JSON.parse(raw)}catch{}final={http:r.status,json:body!==null,body};if(r.ok&&body?.kind==='runtime_fetch_differential_v2')break;await new Promise(x=>setTimeout(x,2500))}
          console.log(`RUNTIME_FETCH_DIFF_V2_SAFE=${JSON.stringify(final)}`);if(final?.http!==200||final?.body?.kind!=='runtime_fetch_differential_v2')throw new Error('RUNTIME_FETCH_DIFF_V2_FAILED');
          NODE
      - name: Remove probe and redeploy clean source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f functions/api/runtime/fetch-diff-v2.ts
          npm run cloudflare:functions:build
          output="$(npx wrangler pages deploy dist --project-name="${CLOUDFLARE_PAGES_PROJECT}" --branch=main 2>&1)"
          printf '%s\n' "${output}"
          url="$(printf '%s\n' "${output}" | grep -Eo 'https://[a-f0-9]+\.astera-app-staging\.pages\.dev' | tail -n 1)"
          test -n "${url}"
          printf 'RUNTIME_DIFF_CLEAN_URL=%s\n' "${url}" >> "${GITHUB_ENV}"
      - name: Verify cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base=process.env.RUNTIME_DIFF_CLEAN_URL,key=process.env.RUNTIME_DIFF_KEY,expected=process.env.TARGET_SHA;if(!base)throw new Error('CLEAN_URL_MISSING');const mr=await fetch(`${base}/__staging_deployment.json`,{headers:{'Cache-Control':'no-cache'}}),m=await mr.json().catch(()=>({}));const rr=await fetch(`${base}/api/runtime/fetch-diff-v2`,{method:'POST',headers:{'X-Astera-Runtime-Diff-Key':key,'Content-Type':'application/json'},body:'{}'}),raw=await rr.text();let body=null;try{body=JSON.parse(raw)}catch{}const markerOk=mr.ok&&m.github_sha===expected&&m.branch==='main',removed=body?.kind!=='runtime_fetch_differential_v2';console.log(`RUNTIME_FETCH_DIFF_V2_CLEANUP_SAFE=${JSON.stringify({marker_http:mr.status,marker_sha_match:m.github_sha===expected,route_http:rr.status,diagnostic_marker_present:body?.kind==='runtime_fetch_differential_v2'})}`);if(!markerOk||!removed)throw new Error('RUNTIME_FETCH_DIFF_V2_CLEANUP_FAILED');console.log('RUNTIME_FETCH_DIFF_V2_EPHEMERAL_ROUTE_REMOVED=PASS');console.log('RUNTIME_FETCH_DIFF_V2_FINAL_DEPLOYMENT_SHA=PASS');
          NODE
