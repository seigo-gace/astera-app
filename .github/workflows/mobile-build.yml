name: Mobile Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_ASTERA_API_BASE: ${{ vars.VITE_ASTERA_API_BASE || 'https://api.asterav8.jp' }}
  VITE_ASTERA_HP_URL: ${{ vars.VITE_ASTERA_HP_URL || 'https://asterav8.jp/' }}

jobs:
  web-audit:
    name: Web tablet mobile source audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Install exact direct dependencies
        run: npm install --no-fund

      - name: Validate browser scripts
        run: |
          node --check public/app-interactions.js
          node --check public/guide-ai-runtime.js

      - name: Audit canonical route coverage
        run: npm run route:audit

      - name: Audit responsive platform behavior
        run: npm run responsive:audit

      - name: Audit device and legacy WebView compatibility
        run: npm run device:audit

      - name: Audit mobile source boundaries
        run: npm run mobile:audit

      - name: Typecheck and build Web source
        run: npm run build

      - name: Upload lockfile candidate
        uses: actions/upload-artifact@v4
        with:
          name: astera-package-lock-candidate
          path: package-lock.json
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android debug APK
    needs: web-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install exact direct dependencies
        run: npm install --no-fund

      - name: Build and sync Android shell
        run: npm run mobile:sync

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: astera-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS unsigned app
    needs: web-audit
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Install exact direct dependencies
        run: npm install --no-fund

      - name: Build and sync iOS shell
        run: npm run mobile:sync

      - name: Build unsigned iOS app
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned iOS app
        working-directory: ios/App
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r Astera-iOS-Simulator.zip App.app

      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: astera-ios-simulator
          path: ios/App/build/Build/Products/Debug-iphonesimulator/Astera-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
