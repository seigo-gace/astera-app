name: Mobile Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mobile-build.yml'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'package.json'
      - 'scripts/**'
      - 'src/**'
      - 'public/**'
      - 'vite.config.ts'

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_ASTERA_API_BASE: ${{ vars.VITE_ASTERA_API_BASE || 'https://api.asterav8.jp' }}
  VITE_ASTERA_HP_URL: ${{ vars.VITE_ASTERA_HP_URL || 'https://asterav8.jp/' }}

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate and sync Android project
        run: npm run mobile:bootstrap -- android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: astera-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS simulator app
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate and sync iOS project
        run: npm run mobile:bootstrap -- ios

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            ios/build/Build/Products/Debug-iphonesimulator/App.app \
            astera-ios-simulator.zip

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: astera-ios-simulator
          path: astera-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
