name: PR67 Staging Layout Preview

on:
  push:
    branches:
      - fix/gpt-chat-layout-history-evidence-20260927
    paths:
      - 'src/**'
      - 'public/**'
      - 'functions/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/pr67-staging-layout-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr67-staging-layout-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_PREVIEW_WITHOUT_AUTH: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREACCOUNTAPI }}
      CLOUDFLARE_PAGES_PROJECT: 'astera-app-staging'
      STAGING_DOMAIN: 'staging.asterav8.jp'
    steps:
      - name: Checkout exact PR67 commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Require deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Build frontend
        run: npm run build

      - name: Build Cloudflare Functions
        run: npm run cloudflare:functions:build

      - name: Apply Composer Conversation D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          # PR67 adds chat_conversations/chat_turns and purpose_text. The preview
          # workflow must bring the shared staging D1 schema to the exact source
          # contract before exercising the new Functions.
          npx wrangler d1 execute astera-app-staging --remote --file=migrations/d1/0022_chat_conversations.sql

          app_jobs_has_purpose_text="$(
            npx wrangler d1 execute astera-app-staging --remote --json --command "SELECT COUNT(*) AS count FROM pragma_table_info('app_jobs') WHERE name = 'purpose_text';" |
              node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s);const r=p.flatMap(x=>x.results||[]);process.stdout.write(String(r[0]?.count ?? 0));})"
          )"
          if [ "$app_jobs_has_purpose_text" != "1" ]; then
            npx wrangler d1 execute astera-app-staging --remote --command "ALTER TABLE app_jobs ADD COLUMN purpose_text TEXT CHECK (purpose_text IS NULL OR length(purpose_text) <= 2000);"
          fi

          chat_turns_has_purpose_text="$(
            npx wrangler d1 execute astera-app-staging --remote --json --command "SELECT COUNT(*) AS count FROM pragma_table_info('chat_turns') WHERE name = 'purpose_text';" |
              node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s);const r=p.flatMap(x=>x.results||[]);process.stdout.write(String(r[0]?.count ?? 0));})"
          )"
          if [ "$chat_turns_has_purpose_text" != "1" ]; then
            npx wrangler d1 execute astera-app-staging --remote --command "ALTER TABLE chat_turns ADD COLUMN purpose_text TEXT CHECK (purpose_text IS NULL OR length(purpose_text) <= 2000);"
          fi

      - name: Write staging preview marker
        shell: bash
        run: |
          set -euo pipefail
          printf '{"github_sha":"%s","source_branch":"%s","target":"staging-layout-preview","auth_mode":"real"}\n' "${GITHUB_SHA}" "${GITHUB_REF_NAME}" > dist/__staging_deployment.json

      - name: Deploy exact PR67 build to staging custom domain
        run: npx wrangler pages deploy dist --project-name="${CLOUDFLARE_PAGES_PROJECT}" --branch=main

      - name: Verify staging serves exact PR67 build
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const expectedSha = process.env.GITHUB_SHA;
          const domain = process.env.STAGING_DOMAIN;
          let last = '';
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const response = await fetch(`https://${domain}/__staging_deployment.json?sha=${expectedSha}&attempt=${attempt}`, {
                headers: { 'Cache-Control': 'no-cache' },
              });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const body = await response.json();
              if (body.github_sha === expectedSha && body.target === 'staging-layout-preview' && body.auth_mode === 'real') {
                console.log(`Verified https://${domain}/ -> ${expectedSha}`);
                process.exit(0);
              }
              last = JSON.stringify(body);
            } catch (error) {
              last = error instanceof Error ? error.message : String(error);
            }
            await new Promise((resolve) => setTimeout(resolve, 3000));
          }
          throw new Error(`staging exact-SHA readback failed: ${last}`);
          NODE
