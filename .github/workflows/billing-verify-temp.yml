name: Billing Verify Temp

on:
  push:
    branches:
      - reconcile/app-main-20260920

permissions:
  contents: read

jobs:
  billing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contabo/billing-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - name: Install billing dependencies
        run: npm install --no-fund --no-audit
      - name: Build billing service
        run: npm run build
      - name: Test billing service
        run: npm test
