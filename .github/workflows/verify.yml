name: verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Typecheck Worker contracts and Contabo runtime
        run: npm run contract:check
      - name: Typecheck and build frontend
        run: npm run build
      - name: Bundle Cloudflare Pages Functions
        run: npm run cloudflare:functions:build

  build-and-device-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - name: Install exact direct dependencies and workspaces
        run: npm install --no-fund --no-audit
      - name: Validate current public browser scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find public -maxdepth 1 -type f -name '*.js' -print0 | sort -z)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No public browser scripts found" >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            node --check "$script"
          done
      - name: Audit canonical route coverage
        run: npm run route:audit
      - name: Audit responsive behavior
        run: npm run responsive:audit
      - name: Audit device and legacy WebView compatibility
        run: npm run device:audit
      - name: Audit native source boundaries
        run: npm run mobile:audit
      - name: Audit adversarial user journeys
        run: npm run story:audit:strict
      - name: Typecheck Worker contracts and Contabo runtime
        run: npm run contract:check
      - name: Typecheck and build frontend
        run: npm run build
      - name: Bundle Cloudflare Pages Functions
        run: npm run cloudflare:functions:build
      - name: Build Contabo runtime
        run: npm run contabo:build
      - name: Run Contabo provider unit tests
        run: npm run contabo:test
      - name: Run Contabo runtime smoke
        run: npm --prefix contabo/app-api run smoke
      - name: Build non-root Contabo container
        run: docker build -f contabo/app-api/Dockerfile .
      - name: Generate Notion repository audit report
        run: npm run notion:audit
      - name: Enforce source readiness gate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('audit-results/notion-repository-audit.json', 'utf8'));
          if (report.sourceVerdict !== 'PASS') {
            console.error(JSON.stringify(report.sourceGaps || [], null, 2));
            process.exit(1);
          }
          console.log('Source readiness: PASS');
          NODE
      - name: Upload source audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astera-source-audits
          path: |
            audit-results/notion-repository-audit.json
            audit-results/user-story-audit.json
          if-no-files-found: warn
          retention-days: 30
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run device and user journey browser matrix
        run: npm run e2e:devices
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astera-device-and-story-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload lockfile candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astera-package-lock-candidate
          path: package-lock.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce final Notion source gate
        if: always()
        run: npm run notion:audit:strict
