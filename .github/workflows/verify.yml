name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-device-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - name: Install exact direct dependencies
        run: npm install --no-fund
      - name: Validate browser scripts
        run: |
          node --check public/app-interactions.js
          node --check public/process-user-errors.js
          node --check public/ui-honesty.js
          node --check public/customer-ai-transport.js
          node --check public/customer-ai-bubble.js
      - name: Audit canonical route coverage
        run: npm run route:audit
      - name: Audit responsive behavior
        run: npm run responsive:audit
      - name: Audit device and legacy WebView compatibility
        run: npm run device:audit
      - name: Audit native source boundaries
        run: npm run mobile:audit
      - name: Audit adversarial user journeys
        run: npm run story:audit:strict
      - name: Typecheck Notion-derived contracts and service boundaries
        run: npm run contract:check
      - name: Typecheck and build frontend
        run: npm run build
      - name: Generate Notion repository audit report
        run: npm run notion:audit
      - name: Upload source audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astera-source-audits
          path: |
            audit-results/notion-repository-audit.json
            audit-results/user-story-audit.json
          if-no-files-found: warn
          retention-days: 30
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run device and user journey browser matrix
        run: npm run e2e:devices
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astera-device-and-story-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload lockfile candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astera-package-lock-candidate
          path: package-lock.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce final Notion source gate
        if: always()
        run: npm run notion:audit:strict
