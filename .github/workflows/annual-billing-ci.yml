name: Annual Billing CI

on:
  push:
    branches:
      - feature/annual-billing-cycle
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  square-sandbox-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SQUARE_ACCESS_TOKEN: ${{ secrets.ASTERAKEY }}
    steps:
      - name: Require Sandbox token
        run: |
          if [ -z "${SQUARE_ACCESS_TOKEN:-}" ]; then
            echo "ASTERAKEY secret is empty or unavailable" >&2
            exit 1
          fi
      - name: Verify Square Sandbox locations
        run: |
          code=$(curl -sS -o /tmp/square-locations.json -w '%{http_code}' \
            -H "Square-Version: 2026-08-19" \
            -H "Authorization: Bearer ${SQUARE_ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            https://connect.squareupsandbox.com/v2/locations)
          if [ "$code" != "200" ]; then
            echo "Square Sandbox locations probe failed: HTTP $code" >&2
            jq -c '{errors: .errors // []}' /tmp/square-locations.json >&2 || true
            exit 1
          fi
          jq -e '.locations | type == "array" and length > 0' /tmp/square-locations.json >/dev/null
          jq -r '.locations[] | "PASS location id=\(.id) status=\(.status // "UNKNOWN") name=\(.name // "")"' /tmp/square-locations.json
      - name: Verify Square Sandbox subscription catalog access
        run: |
          code=$(curl -sS -o /tmp/square-plans.json -w '%{http_code}' \
            -H "Square-Version: 2026-08-19" \
            -H "Authorization: Bearer ${SQUARE_ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            'https://connect.squareupsandbox.com/v2/catalog/list?types=SUBSCRIPTION_PLAN')
          if [ "$code" != "200" ]; then
            echo "Square Sandbox subscription catalog probe failed: HTTP $code" >&2
            jq -c '{errors: .errors // []}' /tmp/square-plans.json >&2 || true
            exit 1
          fi
          jq -r '"PASS subscription plans=" + (((.objects // []) | length) | tostring)' /tmp/square-plans.json

  annual-billing-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Validate browser scripts that exist
        run: |
          checked=0
          for file in public/app-interactions.js public/process-user-errors.js public/ui-honesty.js public/guide-ai-runtime.js; do
            if [ -f "$file" ]; then
              node --check "$file"
              checked=$((checked + 1))
            fi
          done
          echo "validated browser scripts: $checked"
      - name: Audit canonical routes
        run: npm run route:audit
      - name: Audit responsive behavior
        run: npm run responsive:audit
      - name: Audit device compatibility
        run: npm run device:audit
      - name: Audit mobile boundaries
        run: npm run mobile:audit
      - name: Audit user journeys
        run: npm run story:audit:strict
      - name: Typecheck contracts and Contabo runtime
        run: npm run contract:check
      - name: Typecheck and build frontend
        run: npm run build
      - name: Build Cloudflare Pages Functions
        run: npm run cloudflare:functions:build
      - name: Build Contabo runtime
        run: npm run contabo:build
      - name: Test Contabo runtime
        run: npm run contabo:test
      - name: Run Contabo runtime smoke
        run: npm --prefix contabo/app-api run smoke
      - name: Build non-root Contabo container
        run: docker build -f contabo/app-api/Dockerfile .
      - name: Generate Notion source audit report
        run: npm run notion:audit
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser device and user journey matrix
        run: npm run e2e:devices
      - name: Enforce final Notion source gate
        if: always()
        run: npm run notion:audit:strict
