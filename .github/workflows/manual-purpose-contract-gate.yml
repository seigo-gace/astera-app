name: Manual Purpose Contract Gate

on:
  pull_request:
    paths:
      - 'src/features/composer/**'
      - 'functions/api/jobs/**'
      - 'functions/_job-policy.ts'
      - 'functions/_purpose-control.ts'
      - 'functions/_runtime.ts'
      - 'functions/_history-store.ts'
      - 'functions/_template-store.ts'
      - 'functions/_project-store.ts'
      - 'functions/_app-event-outbox*.ts'
      - 'public/canonical-interaction-contract.js'
      - 'migrations/d1/0009_result_settlement_trigger.sql'
      - 'migrations/d1/0021_purpose_history_index.sql'
      - 'packages/contracts/src/jobs.ts'
      - 'packages/contracts/src/app-events.ts'
      - 'contabo/app-api/package.json'
      - 'contabo/app-api/src/**'
      - 'scripts/sync-app-event-contracts.mjs'
      - 'scripts/purpose-control-plane-audit.mjs'
      - 'docs/integrations/tgserver-vnext-app-event-log-design.md'
      - 'docs/integrations/tgserver-vnext-app-event-emission-map.md'
      - 'docs/integrations/tgserver-vnext-app-event-outbox-schema.sql'
      - 'tests/app-event-outbox-repository-regression.test.mjs'
      - 'tests/manual-purpose-contract.spec.ts'
      - 'tests/manual-purpose-long-regression.spec.ts'
      - 'tests/purpose-control-plane-regression.test.mjs'
      - '.github/workflows/manual-purpose-contract-gate.yml'
  push:
    branches: [main]
    paths:
      - 'src/features/composer/**'
      - 'functions/api/jobs/**'
      - 'functions/_job-policy.ts'
      - 'functions/_purpose-control.ts'
      - 'functions/_runtime.ts'
      - 'functions/_history-store.ts'
      - 'functions/_template-store.ts'
      - 'functions/_project-store.ts'
      - 'functions/_app-event-outbox*.ts'
      - 'public/canonical-interaction-contract.js'
      - 'migrations/d1/0009_result_settlement_trigger.sql'
      - 'migrations/d1/0021_purpose_history_index.sql'
      - 'packages/contracts/src/jobs.ts'
      - 'packages/contracts/src/app-events.ts'
      - 'contabo/app-api/package.json'
      - 'contabo/app-api/src/**'
      - 'scripts/sync-app-event-contracts.mjs'
      - 'scripts/purpose-control-plane-audit.mjs'
      - 'docs/integrations/tgserver-vnext-app-event-log-design.md'
      - 'docs/integrations/tgserver-vnext-app-event-emission-map.md'
      - 'docs/integrations/tgserver-vnext-app-event-outbox-schema.sql'
      - 'tests/app-event-outbox-repository-regression.test.mjs'
      - 'tests/manual-purpose-contract.spec.ts'
      - 'tests/manual-purpose-long-regression.spec.ts'
      - 'tests/purpose-control-plane-regression.test.mjs'
      - '.github/workflows/manual-purpose-contract-gate.yml'

concurrency:
  group: manual-purpose-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manual-purpose-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Typecheck App and Functions
        run: |
          npm run check
          npm run contract:check
      - name: Audit Purpose control/data-plane separation
        run: node scripts/purpose-control-plane-audit.mjs
      - name: Run Source contract regressions
        run: node --experimental-strip-types --test tests/purpose-control-plane-regression.test.mjs tests/app-event-outbox-repository-regression.test.mjs
      - name: Run App Runtime purpose contract tests
        run: npm run contabo:test
      - name: Install browser representatives
        run: npx playwright install --with-deps chromium webkit
      - name: Run Composer manual-purpose browser contract
        run: npx playwright test tests/manual-purpose-contract.spec.ts tests/manual-purpose-long-regression.spec.ts --project=chromium-desktop --project=webkit-iphone-large --workers=2
