name: Manual Purpose Contract Gate

on:
  pull_request:
    paths:
      - 'src/features/composer/**'
      - 'functions/api/jobs/**'
      - 'functions/_job-policy.ts'
      - 'functions/_runtime.ts'
      - 'contabo/app-api/src/**'
      - 'tests/composer-user-stories.spec.ts'
      - '.github/workflows/manual-purpose-contract-gate.yml'
  push:
    branches: [main]
    paths:
      - 'src/features/composer/**'
      - 'functions/api/jobs/**'
      - 'functions/_job-policy.ts'
      - 'functions/_runtime.ts'
      - 'contabo/app-api/src/**'
      - 'tests/composer-user-stories.spec.ts'
      - '.github/workflows/manual-purpose-contract-gate.yml'

permissions:
  contents: read

jobs:
  manual-purpose-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Typecheck App and Functions
        run: |
          npm run check
          npm run contract:check
      - name: Run App Runtime purpose contract tests
        run: npm run contabo:test
      - name: Install browser representatives
        run: npx playwright install --with-deps chromium webkit
      - name: Run Composer manual-purpose browser contract
        run: npx playwright test tests/composer-user-stories.spec.ts --project=chromium-desktop --project=webkit-iphone-large --workers=2 --grep 'STORY-COMPOSER-011'
