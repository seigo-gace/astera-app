name: Temporary Real Auth E2E Residue Readonly Audit

on:
  pull_request:
    paths:
      - '.github/workflows/real-auth-e2e-residue-readonly.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREACCOUNTAPI }}
      CLOUDFLARE_ACCOUNT_ID: '6749a1289acc6c158a4621c26c3fbe08'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Read only E2E residue
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --ignore-scripts >/dev/null 2>&1
          q() { npx wrangler d1 execute astera-app-staging --remote --json --command "$1"; }
          selector='email LIKE "astera-e2e-%" AND "emailVerified"=0 AND "createdAt" BETWEEN "2026-09-23T12:13:00.000Z" AND "2026-09-23T12:24:00.000Z"'
          echo '=== TARGET_USER_ROWS ==='
          q "SELECT COUNT(*) AS count, MIN(\"createdAt\") AS min_created, MAX(\"createdAt\") AS max_created FROM \"user\" WHERE ${selector};"
          echo '=== ACCOUNT_ROWS ==='
          q "SELECT COUNT(*) AS count FROM \"account\" WHERE \"userId\" IN (SELECT id FROM \"user\" WHERE ${selector});"
          echo '=== SESSION_ROWS ==='
          q "SELECT COUNT(*) AS count FROM \"session\" WHERE \"userId\" IN (SELECT id FROM \"user\" WHERE ${selector});"
          echo '=== PROFILE_ROWS ==='
          q "SELECT COUNT(*) AS count FROM user_profiles WHERE user_id IN (SELECT id FROM \"user\" WHERE ${selector});"
          echo '=== CREDIT_ACCOUNT_ROWS ==='
          q "SELECT COUNT(*) AS count FROM credit_accounts WHERE tenant_id IN (SELECT 'personal:' || id FROM \"user\" WHERE ${selector});"
          echo '=== REDEMPTION_ROWS ==='
          q "SELECT COUNT(*) AS count FROM coupon_redemptions WHERE user_id IN (SELECT id FROM \"user\" WHERE ${selector});"
          echo '=== VERIFICATION_ROWS_BY_EMAIL ==='
          q 'SELECT COUNT(*) AS count FROM verification WHERE identifier LIKE "astera-e2e-%";'
