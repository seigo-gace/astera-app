name: Temporary Real Auth E2E Residue Cleanup

on:
  pull_request:
    paths:
      - '.github/workflows/real-auth-e2e-residue-readonly.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREACCOUNTAPI }}
      CLOUDFLARE_ACCOUNT_ID: '6749a1289acc6c158a4621c26c3fbe08'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Delete only this audit's unverified E2E accounts and verify zero residue
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --ignore-scripts >/dev/null 2>&1
          q() { npx wrangler d1 execute astera-app-staging --remote --json --command "$1"; }
          selector='email LIKE "astera-e2e-%" AND "emailVerified"=0 AND "createdAt" BETWEEN "2026-09-23T12:13:00.000Z" AND "2026-09-23T12:24:00.000Z"'
          before="$(q "SELECT COUNT(*) AS count FROM \"user\" WHERE ${selector};")"
          count="$(BEFORE="$before" node -e "const x=JSON.parse(process.env.BEFORE);process.stdout.write(String(x.flatMap(v=>v.results||[])[0]?.count??-1))")"
          echo "TARGET_BEFORE=${count}"
          test "$count" = '3' || { echo "Refusing cleanup: expected exactly 3 target users, found ${count}" >&2; exit 1; }
          q "DELETE FROM \"account\" WHERE \"userId\" IN (SELECT id FROM \"user\" WHERE ${selector}); DELETE FROM \"user\" WHERE ${selector};"
          after="$(q "SELECT COUNT(*) AS users FROM \"user\" WHERE email LIKE 'astera-e2e-%'; SELECT COUNT(*) AS accounts FROM \"account\" WHERE \"userId\" NOT IN (SELECT id FROM \"user\");")"
          AFTER="$after" node <<'NODE'
          const x=JSON.parse(process.env.AFTER);
          const rows=x.flatMap(v=>v.results||[]);
          const users=Number(rows.find(r=>Object.hasOwn(r,'users'))?.users ?? -1);
          const orphanAccounts=Number(rows.find(r=>Object.hasOwn(r,'accounts'))?.accounts ?? -1);
          console.log(`TARGET_PREFIX_USERS_AFTER=${users}`);
          console.log(`ORPHAN_ACCOUNTS_AFTER=${orphanAccounts}`);
          if(users!==0) throw new Error(`E2E_RESIDUE_REMAINS:${users}`);
          if(orphanAccounts!==0) throw new Error(`ORPHAN_ACCOUNT_ROWS:${orphanAccounts}`);
          console.log('E2E_RESIDUE_CLEANUP=PASS');
          NODE
