name: Composer Conversation Gate

on:
  push:
    branches:
      - 'fix/gpt-chat-layout-history-evidence-*'
    paths:
      - 'src/features/composer/**'
      - 'src/features/history/**'
      - 'src/platform/ResponsivePageShell.tsx'
      - 'src/platform/app-router.tsx'
      - 'src/platform/route-registry.ts'
      - 'functions/_conversation-store.ts'
      - 'functions/api/conversations/**'
      - 'migrations/d1/0022_chat_conversations.sql'
      - 'tests/composer-user-stories.spec.ts'
      - '.github/workflows/composer-conversation-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/features/composer/**'
      - 'src/features/history/**'
      - 'src/platform/ResponsivePageShell.tsx'
      - 'src/platform/app-router.tsx'
      - 'src/platform/route-registry.ts'
      - 'functions/_conversation-store.ts'
      - 'functions/api/conversations/**'
      - 'migrations/d1/0022_chat_conversations.sql'
      - 'tests/composer-user-stories.spec.ts'
      - '.github/workflows/composer-conversation-gate.yml'

permissions:
  contents: read

jobs:
  composer-conversation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Typecheck frontend
        run: npm run check
      - name: Audit canonical routes
        run: npm run route:audit
      - name: Bundle Cloudflare Functions
        run: npm run cloudflare:functions:build
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run Composer conversation user stories
        run: npx playwright test tests/composer-user-stories.spec.ts --workers=2
