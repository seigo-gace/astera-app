name = "astera-app-staging"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# D1: create via MCP, then set database_id below.
[[d1_databases]]
binding = "ASTERA_DB"
database_name = "astera-app-staging"
# database_id = "REPLACE_AFTER_MCP_PROVISIONING"

[[r2_buckets]]
binding = "ASTERA_UPLOADS"
bucket_name = "astera-app-uploads-staging"
